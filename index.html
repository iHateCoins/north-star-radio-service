  ];
  for (const [k,t,uF,V,p] of caps) CATALOG[k] = {kind:'C', ctype:t, uF, V, price:p};

function fmtOhms(o){ if (!isFinite(o)) return '∞'; if (o>=1e6) return +(o/1e6).toPrecision(2)+' MΩ'; if (o>=1e3) return +(o/1e3).toPrecision(3)+' kΩ'; return +o.toPrecision(3)+' Ω'; }
function fmtCap(uF){ if (uF<1e-3) return Math.round(uF*1e6)+' pF'; if (uF<1) return '.'+String(+uF.toPrecision(2)).split('.')[1]+' µF'; return uF+' µF'; }
function fmtW(w){ return w===0.5?'½ W':w===0.25?'¼ W':w+' W'; }
function skuName(sku){
  const c = CATALOG[sku]; if (!c) return sku;
  if (sku==='R500-2') return '500 Ω field-coil proxy (not a resistor)';
  if (c.kind==='R') return `${fmtOhms(c.ohms)} ${fmtW(c.W)} carbon`;
  if (c.kind==='C') return `${fmtCap(c.uF)} ${c.V} V ${c.ctype}`;
  if (c.kind==='TUBE') return `${c.tube} tube`;
  return {OT:'Output transformer (50L6GT)',SPK:'field-coil dynamic speaker (prototype voice coil)',VR:'500 kΩ volume control w/ switch',COIL:'Oscillator coil',IFT:'455 kc IF transformer'}[c.kind];
}

function pt44FactorySubgraphAudit(){
  const g=PT44_FACTORY_SUBGRAPH, issues=[], seen=new Map(), rows=[];
  const validParts=new Set(Object.keys(SLOTS)), supplementary=new Set(['T1:sA','T1:sB','SP1:voiceA','SP1:voiceB']);
  const modeled=PT44_MODEL.nodes;
  const factoryHeaterLinks = new Set(g.nets.filter(n=>n.stage==='Heaters').map(n=>n.members.slice().sort().join('|')));
  const modelHeaterLinks = new Set(PT44_MODEL.heater.links.map(n=>n.slice().sort().join('|')));
  for(const link of factoryHeaterLinks) if(!modelHeaterLinks.has(link)) issues.push('Factory heater junction absent in playable wiring: '+link);
  for(const link of modelHeaterLinks) if(!factoryHeaterLinks.has(link)) issues.push('Playable heater junction missing from factory diagram: '+link);
  for(const net of g.nets){
    if(net.members.length<2) issues.push(net.id+': need at least two terminals');
    const proto = net.model ? (modeled[net.model]||[]) : [];
    const inPrototype=[], unresolved=[], extra=[];
    for(const ref of net.members){
      const previous=seen.get(ref);
      if(previous && previous!==net.id) issues.push(ref+': assigned to '+previous+' and '+net.id);
      seen.set(ref,net.id);
      const [id,pin]=ref.split(':');
      if(!validParts.has(id)) issues.push('Unknown factory component '+ref);
      if(id.startsWith('V') && /^\d+$/.test(pin)){
        const tube=PT44_REF.tubes.find(t=>t.id===id);
        if(!tube || !(pin in tube.pins) || /no connection/i.test(tube.pins[pin])) issues.push('Invalid socket terminal '+ref);
      }
      if(net.model && !supplementary.has(ref)){
        if(proto.includes(ref)) inPrototype.push(ref);
        else {unresolved.push(ref); issues.push(net.id+': verified '+ref+' missing from playable '+net.model);}
      }
    }
    if(net.model) for(const ref of proto) if(!net.members.includes(ref)) extra.push(ref);
    rows.push({id:net.id,model:net.model,verified:net.members.length,inPrototype:inPrototype.length,missing:unresolved,unverifiedExtra:extra});
  }
  for(const [id,info] of Object.entries(g.factory_part_register)){
    if(!PT44_REF.parts.some(p=>String(p[0])===id)) issues.push('Reference part #'+id+' not in PT44 factory list');
    if(info.game_slot && !(info.game_slot in SLOTS)) issues.push('Unknown prototype slot '+info.game_slot);
  }
  if(Object.keys(g.factory_part_register).length!==33)issues.push('Expected 33 factory numbered entries');
  const vals=Object.values(g.factory_part_register);
  return {ok:issues.length===0,issues,netCount:g.nets.length,terminalCount:seen.size,
    partsTraced:vals.filter(p=>p.connection_status==='traced').length,
    partsPartial:vals.filter(p=>p.connection_status==='partial').length,
    partCount:vals.length,unassigned:vals.filter(p=>p.connection_status==='not_transcribed').length,
    modelDiscrepancies:rows.filter(p=>p.unverifiedExtra.length>0),checks:rows,
    benchmarkReady:g.benchmark_gates.every(x=>x.status==='pass')&&issues.length===0};
}

// Source-traced electrical contacts only. This does NOT validate the physical bends or wire dressing.
function pt44FactoryContactScope(net,a,b){
  const nets=PT44_FACTORY_V3.factory_nets;
  if(net==='HEATER')return nets.some(n=>n.stage==='Heaters'&&
    n.prototype_member_crosswalk.slice().sort().join('|')===[a,b].sort().join('|'));
  const members=new Set(nets.filter(n=>n.model===net).flatMap(n=>n.prototype_member_crosswalk));
  if(!members.size)return false;
  const hub=r=>r===net || (net==='GND' && /^G[1-5]$/.test(r));
  return (members.has(a) && (members.has(b)||hub(b))) || (members.has(b)&&hub(a));
}

      }

let _pid = 1;
function rnd(a,b){ return a+Math.random()*(b-a); }
function newPart(sku, opts={}){

// Effective leakage resistance (ohms) of a capacitor at a given applied voltage.

function newRadio(){

// ---------- Tube models (Child-Langmuir 3/2-power) ----------
const sp = (x,s=0.3)=> x>20*s ? x : s*Math.log1p(Math.exp(x/s)); // smooth max(0,x)

// ---------- DC solve ----------

function heaterString(r){

function solveDC(r, env={}, guess=null){

  const oscOk = s.L1 && !s.L1.open && s.C4 && !s.C4.open && s.C4.leak0>1 && r6>3000 && r6<250e3 && vb2g>50;

  const hasT = id => lit && s[id];
  function devices(V, out){ // out[i] = current drawn OUT of node i by devices (sources negative)
    const v = n => n==null?0:V[NI[n]];

    if (eR>0){ const x = Veff - v('B1'); out[NI.B1] -= sp(x,0.5)/Rs; }

function gauss(A, b){
  const n=b.length, M=A.map((r,i)=>[...r,b[i]]);

    if (Math.abs(M[p][c])<1e-30) return null; [M[c],M[p]]=[M[p],M[c]];

// ---------- Ohmmeter (power off, linear network) ----------
function ohmsBetween(r, a, b){
  const s=r.slots, N=NODES.length, G=[...Array(N)].map(()=>new Float64Array(N));
  const add=(x,y,ohms)=>{ if(!(ohms>0)||!isFinite(ohms)) return; const g=1/ohms, i=x==null?-1:NI[x], j=y==null?-1:NI[y];
    if(i>=0) G[i][i]+=g; if(j>=0) G[j][j]+=g; if(i>=0&&j>=0){G[i][j]-=g;G[j][i]-=g;} };
  for (const id of ['R1','R2','R3','R4','R5','R6','R7','T1','T2','T3']){ const p=s[id],d=SLOTS[id]; if(p&&!p.open) add(d.a,d.b,p.ohms); }
  for (const id of ['C1','C2','C3']){ const p=s[id],d=SLOTS[id]; if(p) add(d.a,d.b,capLeakOhms(p,1.5)); }
  for (let i=0;i<N;i++) G[i][i]+=1e-11;

  const V = gauss(G.map(r=>Array.from(r)), I); if(!V) return Infinity;

// Out-of-circuit test of a loose part
function partOhms(p){

  if (p.kind==='C') return capLeakOhms(p,1.5);
  if (p.kind==='OT'||p.kind==='IFT') return p.open?Infinity:p.ohms;
  if (p.kind==='SPK') return p.open?Infinity:3.2;
  if (p.kind==='COIL') return p.open?Infinity:2.6;

// ---------- Signal path ----------
const STATIONS = [
  {kc:610, call:'KPLN', prog:'band',  pwr:1.0},
  {kc:880, call:'WEBR', prog:'talk',  pwr:0.85},
  {kc:1150,call:'KDOX', prog:'waltz', pwr:0.55},
  {kc:1340,call:'WTCN', prog:'news',  pwr:0.32},

function stationAt(kc){
  let best=null, bs=0;
  for (const st of STATIONS){ const x=st.pwr*Math.exp(-Math.pow((kc-st.kc)/9,2)); if(x>bs){bs=x;best=st;} }
  return {st:best, s:bs};

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
// Reference healthy values for normalisation (filled by calibrate())
const REF = {Icv:1, Iif:1, gm6:1, gm5:1, Av6:1};
function sigPath(r, d){

  const {st, s:strength} = stationAt(r.dial);

  const gConv = d.A * clamp(d.Icv/REF.Icv,0,1.4);
  const gIF = clamp(d.Iif/REF.Iif,0,1.4) * (s.T2&&!s.T2.open?1:0) * (s.T3&&!s.T3.open?1:0);

  const c3 = s.C3 && !s.C3.open ? s.C3.uF : 0;
  const Rg = s.R3&&!s.R3.open ? s.R3.ohms : 5e6;

}
function calibrate(){
  const r = newRadio();

// ---------- Damage from electrical stress (dt in seconds) ----------
function applyStress(r, d, dt, log){

    // Above-chassis components receive visible ceramic feedthroughs and terminal studs.
    const feed=['T1','T2','T3','C1','C2'].includes(id);
    const tube=!!SLOTS[id]&&SLOTS[id].type==='TUBE';
    const node=!!lugPts[ref];
    if(feed){
      const ins=new THREE.Mesh(new THREE.CylinderGeometry(.115,.115,.12,12),M(0xc3ae80,{roughness:.68}));
      ins.position.copy(p);ins.position.y=.06;contactG.add(ins);
      const stem=new THREE.Mesh(new THREE.CylinderGeometry(.038,.038,.24,10),M(0xb39a67,{metalness:.5,roughness:.38}));
      stem.position.copy(p);stem.position.y=.18;contactG.add(stem);
    }
    if(node){
      // Test-point eyelets and grounded lugs already exist in the solid model.
      return;
    }
    const bead=new THREE.Mesh(new THREE.SphereGeometry(tube?.085:.067,10,8),M(0xbcbab0,{metalness:.72,roughness:.28}));
    bead.position.copy(p); contactG.add(bead);
  }
  let skippedDraws=[];
  function routeMemberToHub(memberRef, hubRef, colorKey='signal'){
    const a=attachPos(memberRef), b=attachPos(hubRef); if(!a||!b) return;
    const color = wireColor[colorKey] || wireColor.signal;
    routeBetween(a,b,color);
  }
  function colorForNet(net){
    if (net==='B1' || net==='B2') return 'bplus';
    if (net==='G5' || net==='G6' || net==='OSC') return 'grid';
    if (net==='GND') return 'ground';
    return 'signal';
  }
  function groundMemberHub(member){
    if (member.startsWith('R6') || member.startsWith('C4')) return 'G1';
    if (member.startsWith('R7')) return 'G2';
    if (member.startsWith('R5') || member.startsWith('R4')) return 'G3';
    if (member.startsWith('R3') || member.startsWith('V4') || member.startsWith('C1')) return 'G4';
    return 'G5';
  }
  let traceNet=null;
  let conductorRecords=[];
  function activeTerminal(ref){
    const id=ref.split(':')[0];
    return !curJob || !SLOTS[id] || !curJob.slots || !!curJob.slots[id];
  }
  function drawConductor(aRef,bRef,net,kind){
    if(!activeTerminal(aRef)||!activeTerminal(bRef)) return;
    const a=attachPos(aRef),b=attachPos(bRef);
    if(!a||!b){ skippedDraws.push({net,from:aRef,to:bRef,reason:!a?'Missing '+aRef:'Missing '+bRef}); return; }
    if(a.distanceTo(b)<0.02) return;
    addPhysicalContact(aRef);addPhysicalContact(bRef);
    const mesh=routeBetween(a,b,wireInsulation(aRef,bRef,net,kind));
    mesh.userData.net=net; mesh.userData.endpoints=[aRef,bRef];
    mesh.material=mesh.material.clone();conductorRecords.push(mesh);
  }
  // Evidence scope is deliberately terminal-level, NOT a certification of the 3D wire bends.
  // Factory connections are selected only from source-constrained graph memberships.
  let sourceScoped=false;
  function isSourceScopedConductor(mesh){
    const [a,b]=mesh.userData.endpoints||[];
    return a&&b ? pt44FactoryContactScope(mesh.userData.net,a,b) : false;
  }
  function updateTrace(){
    for(const mesh of conductorRecords){
      mesh.visible=!sourceScoped || isSourceScopedConductor(mesh);
      const selected=traceNet && mesh.userData.net===traceNet;
      mesh.material.emissive.setHex(selected?0xff9c2a:0x000000);
      mesh.material.emissiveIntensity=selected?0.85:0;
      mesh.material.transparent=!!traceNet;
      mesh.material.opacity=traceNet?(selected?1:0.13):1;
    }
  }
  api.sourceScope=function(on){sourceScoped=!!on;updateTrace();};
  api.sourceScopeSummary=function(){return {sourceScope:sourceScoped,shown:conductorRecords.filter(m=>m.visible).length,total:conductorRecords.length};};
  api.trace=function(node){ traceNet=node||null;updateTrace(); };
  api.traceList=function(){ return conductorRecords.map(m=>({net:m.userData.net,from:m.userData.endpoints[0],to:m.userData.endpoints[1]})); };
  function rebuildUnderWiring(){
    // Contact hardware and conductors are regenerated together when a radio part is removed.
    disposeGroup(wiringG); freeContactMeshes(); conductorRecords=[];skippedDraws=[];
    for(const [a,b] of PT44_MODEL.heater.links) drawConductor(a,b,'HEATER','heater');
    drawConductor(PT44_MODEL.heater.entry,'AC_FEED','HEATER','heater');
    drawConductor(PT44_MODEL.heater.exit,'AC_RETURN','HEATER','heater');
    // The graph uses named nodes, not decorative connections. Different supply nodes
    // are NEVER bridged together merely to fill space in the 3D scene.
    for(const [net,members] of Object.entries(PT44_MODEL.nodes)){
      const endpoints=members.filter(ref=>attachPos(ref)!==null);
      if(!endpoints.length)continue;
      const hub=(net==='GND')?null:(lugPts[net]?net:null);
      if(hub){
        for(const ref of endpoints) drawConductor(ref,hub,net,'signal');
      }else{
        // Chassis-return lugs are tied by the modeled B-minus reference, but not
        // represented as factory-verified chassis-ground bonds.
        for(const ref of endpoints){
          const dest=net==='GND'?groundMemberHub(ref):endpoints[0];
          if(ref!==dest) drawConductor(ref,dest,net,'signal');
        }
      }
    }
    // The reduced-order solver treats these five chassis-return lugs as ONE net.
    // Without a common-return link, their 3D appearance falsely shows isolated grounds.
    for(const [a,b] of [['G1','G2'],['G2','G3'],['G3','G4'],['G4','G5']])
      drawConductor(a,b,'GND','signal');
    updateTrace();
  }
  api.geometryAudit=function(){
    const exposed=[],outside=[],missingLugs=[],waypointWarnings=[];
    const margin=0.14;
    function within(p){return Math.abs(p.x)<=W/2-margin && Math.abs(p.z)<=D/2-margin;}
    for(const [ref,pt] of Object.entries(lugPts)){
      if(!within(pt)) outside.push({ref,kind:'eyelet',x:+pt.x.toFixed(2),z:+pt.z.toFixed(2)});
    }
    for(const m of conductorRecords){
      const refs=m.userData.endpoints;
      for(const ref of refs){
        if(!contactRefs.has(ref))exposed.push(ref);
        const pt=attachPos(ref);
        if(!pt) missingLugs.push(ref);
        else if(!within(pt)) outside.push({ref,kind:'terminal',x:+pt.x.toFixed(2),z:+pt.z.toFixed(2)});
      }
      for(const [i,p] of (m.userData.waypoints||[]).entries()){
        if(!within({x:p[0],z:p[2]})) waypointWarnings.push(`${refs.join(' → ')} [${i}]`);
      }
    }
    // Fully in bounds is necessary but not sufficient: electrical topology must still be validated.
    return {wireCount:conductorRecords.length,anchoredContacts:contactRefs.size,
      looseEnds:[...new Set(exposed)],unresolvedRoutes:skippedDraws.slice(),
      outOfBounds:outside,offChassisRoutes:waypointWarnings,
      chassis:{width:W,depth:D,clearance:margin},
      note:'Mechanical endpoint/route checks on the prototype graph; NOT a factory wiring certification.'};
  };

  let probeLead=null, blackLead=null;

  function tagGroup(g,id){ g.traverse(o=>{ o.userData.slot=id; if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; pickables.push(o); if (o.material && o.material.isMeshStandardMaterial && !o.material._own){ o.material=o.material.clone(); o.material._own=true; } } }); }
  function untag(g){ g.traverse(o=>{ const i=pickables.indexOf(o); if(i>=0) pickables.splice(i,1); }); }
  function buildFor(id,p){
    const t=SLOTS[id].type; let g;
    if (t==='TUBE') g=tubeModel(p.tube); else if (t==='IFT') g=canModel(); else if (t==='OT') g=otModel(); else if (t==='COIL') g=coilModel(); else if (t==='VR') g=potModel(); else if (t==='SPK') g=speakerModel(p);
    else if (t==='R') g=resModel(p); else if (t==='C') g = (id==='C1'||id==='C2') ? elecModel(p) : paperCapModel(p);
    tagGroup(g,id); return g; }

  // ---------- animation ----------
  const tweens=[]; const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function tween(dur, fn, done){ tweens.push({t:0,dur,fn,done}); }
  const smokes=[];
  function puff(worldPos){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex, transparent:true, depthWrite:false, opacity:0.7})); s.position.copy(worldPos); s.scale.set(0.5,0.5,0.5); s.userData.v=new THREE.Vector3((Math.random()-0.5)*0.3,0.9+Math.random()*0.4,(Math.random()-0.5)*0.3); s.userData.life=0; scene.add(s); smokes.push(s); }

  // ---------- state sync ----------
  let curJob=null;
  api.setJob = function(job){
    if (curJob===job.radio) return; curJob=job.radio;
    for (const id of Object.keys(slotObj)){ const o=slotObj[id]; untag(o.g); o.g.parent && o.g.parent.remove(o.g); delete slotObj[id]; }
    buildCabinet(job.cab||'');
    api.sync(job.radio, true);
  };
  api.sync = function(radio, instant){
    for (const id of Object.keys(PLACE)){
      const p=radio.slots[id], cur=slotObj[id], an=anchors[id];
      const sig = p ? p.pid+':'+(p.charred?1:0)+':'+((p.heat>2||p.leak0<0.3)?1:0) : null;
      if (cur && (!p || cur.sig!==sig)){
        const g=cur.g; delete slotObj[id]; untag(g);
        if (!p && !instant){ const y0=g.position.y; tween(0.45, t=>{ const e=ease(t); g.position.y=y0+e*1.6; g.scale.setScalar(1-e*0.6); }, ()=>an.a.remove(g)); }
        else an.a.remove(g);
      }
      if (p && !slotObj[id]){
        const g=buildFor(id,p); an.a.add(g); slotObj[id]={g,sig,pid:p.pid};
        if (!instant && (!cur || cur.pid!==p.pid)){ g.position.y=2; g.scale.setScalar(0.6); tween(0.5, t=>{ const e=ease(t); g.position.y=2*(1-e); g.scale.setScalar(0.6+0.4*e); }); }
      }
      an.ghost.visible = !p;
    }
    rebuildUnderWiring();
    api.select(api._sel);
  };
  api._sel=null;
  api.select = function(slot){ api._sel=slot;
    for (const [id,o] of Object.entries(slotObj)) o.g.traverse(m=>{ if(m.isMesh && m.material && m.material.emissive && m.material._own && !m.material._live) m.material.emissive.setHex(id===slot?0x6a3a08:(id===hoverSlot?0x2a1a06:0x000000)); });
    for (const [id,an] of Object.entries(anchors)) an.ghost.material.color.setHex(id===slot?0xffd27a:0xf2ab3c);
  };
  // live: tube heat 0..1 per tube, red plates, smoking slots, speaker excursion, meter
  let liveState={glow:{},red:{},smoke:[],loud:0,dial:0};
  api.live = function(st){ liveState=st; };
  api.meter = function(frac, text, ohms){ const k=frac.toFixed(3)+text+ohms; if (k!==api._mk){ api._mk=k; drawMeter(frac,text,ohms); } };
  let probeNode=null;
  api.showTestPosts=function(show){for(const o of Object.values(tps)){o.ball.visible=!!show;o.post.visible=!!show;}};
  api.probe = function(node){ if (node===probeNode) return; probeNode=node; rebuildLeads(); for (const [n,o] of Object.entries(tps)) o.ball.material.emissive.setHex(n===node?0xff3010:0x601000); };
  function rebuildLeads(){
    scene.updateMatrixWorld(true);
    if (probeLead){ scene.remove(probeLead); probeLead.geometry.dispose(); probeLead=null; }
    if (blackLead){ scene.remove(blackLead); blackLead.geometry.dispose(); blackLead=null; }
    const start=new THREE.Vector3(); jackR.getWorldPosition(start);
    const bstart=new THREE.Vector3(); jackB.getWorldPosition(bstart);
    const clip=new THREE.Vector3(); chassis.localToWorld(clip.set(-W/2+0.2, api.flipped?-0.6:-1.6, D/2));
    blackLead = hookupWorld([bstart, new THREE.Vector3(bstart.x+1,0.3,bstart.z+0.8), new THREE.Vector3(clip.x-1.2,0.6,clip.z+0.6), clip], 0x151515);
    if (!probeNode || !api.flipped) return;
    const end=new THREE.Vector3(); tps[probeNode].ball.getWorldPosition(end);
    probeLead = hookupWorld([start, new THREE.Vector3(start.x+2,0.3,start.z+1), new THREE.Vector3((start.x+end.x)/2, end.y+2.5, end.z+2), end], 0xb3261e);
  }
  function hookupWorld(pts,color){ const curve=new THREE.CatmullRomCurve3(pts); const m=new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.05,6,false),M(color,{roughness:0.45})); m.castShadow=true; scene.add(m); return m; }

  // ---------- camera ----------
  const cam = {target:new THREE.Vector3(0,2,0), dist:22, theta:0, phi:1.0};
  const VIEWS = { overview:{t:[0,1.6,0],d:26,th:0,ph:1.02}, top:{t:[0,2.6,0],d:16,th:0,ph:0.78}, under:{t:[0,2.6,0],d:16,th:0,ph:0.5}, speaker:{t:[9.6,2.3,-0.5],d:8,th:0.25,ph:1.25}, tray:{t:[-7.5,0.5,4],d:9,th:-0.4,ph:0.9} };
  function applyCam(){ const sp=Math.sin(cam.phi); const narrow=Math.max(1,Math.pow(1.5/Math.max(camera.aspect,0.3),0.75)); const dist=cam.dist*narrow; camera.position.set(cam.target.x+dist*sp*Math.sin(cam.theta), cam.target.y+dist*Math.cos(cam.phi), cam.target.z+dist*sp*Math.cos(cam.theta)); camera.lookAt(cam.target); }
  api.view = function(name){
    const v=VIEWS[name]; if(!v) return;
    const wantFlip = name==='under';
    if (wantFlip!==api.flipped) flip(wantFlip);
    const s={t:cam.target.clone(),d:cam.dist,th:cam.theta,ph:cam.phi}, e={t:new THREE.Vector3(...v.t),d:v.d,th:v.th,ph:v.ph};
    tween(0.8, t=>{ const k=ease(t); cam.target.lerpVectors(s.t,e.t,k); cam.dist=s.d+(e.d-s.d)*k; cam.theta=s.th+(e.th-s.th)*k; cam.phi=s.ph+(e.ph-s.ph)*k; });
  };
  function flip(on){
    api.flipped=on; if (probeLead){ scene.remove(probeLead); probeLead=null; } if (blackLead){ scene.remove(blackLead); blackLead=null; }
    const r0=chassis.rotation.x, r1=on?Math.PI:0, y0=chassis.position.y, y1=on?FLIP_Y:REST_Y;
    if (on) cradle.visible=true;
    tween(0.9, t=>{ const k=ease(t); chassis.rotation.x=r0+(r1-r0)*k; chassis.position.y=y0+(y1-y0)*k + Math.sin(k*Math.PI)*2.2; }, ()=>{ cradle.visible=on; rebuildLeads(); });
    for (const o of Object.values(tps)) o.g.visible=true;
  }

  // ---------- input ----------
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  const pointers=new Map(); let downAt=null, moved=0, pinch0=null, hoverSlot=null;
  const tip=document.createElement('div'); tip.style.cssText='position:absolute;pointer-events:none;background:#1c231fe6;border:1px solid #4a584d;color:#ebe1c8;font:12px "Courier Prime",monospace;padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-140%);display:none;z-index:2';
  function hit(ev){ const r=canvas.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
    const hs=ray.intersectObjects(pickables.filter(o=>o.visible && isShown(o)),false); return hs[0]||null; }
  function isShown(o){ let p=o; while(p){ if(!p.visible) return false; p=p.parent; } return true; }
  canvas.addEventListener('pointerdown', e=>{ canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===1){ downAt={x:e.clientX,y:e.clientY}; moved=0; } else { const [a,b]=[...pointers.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y), dist:cam.dist}; } canvas.style.cursor='grabbing'; });
  canvas.addEventListener('pointermove', e=>{
    const prev=pointers.get(e.pointerId);
    if (prev){ const dx=e.clientX-prev.x, dy=e.clientY-prev.y; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved+=Math.abs(dx)+Math.abs(dy);
      if (pointers.size===1){ cam.theta-=dx*0.006; cam.phi=Math.max(0.15,Math.min(1.45,cam.phi-dy*0.005)); }
      else if (pinch0){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); cam.dist=Math.max(4,Math.min(40,pinch0.dist*pinch0.d/Math.max(d,1))); }
      tip.style.display='none'; return; }
    if (e.pointerType==='mouse'){ const h=hit(e); const s=h&&(h.object.userData.slot||h.object.userData.node)||null;
      const sl=h&&h.object.userData.slot||null; if (sl!==hoverSlot){ hoverSlot=sl; api.select(api._sel); }
      if (s){ const r=canvas.getBoundingClientRect(); tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top)+'px'; tip.textContent = h.object.userData.slot ? `${s} · ${SLOTS[s].name}` : `Test point · ${api.tpName?api.tpName(s):s}`; tip.style.display='block'; canvas.style.cursor='pointer'; }
      else { tip.style.display='none'; canvas.style.cursor='grab'; } }
  });
  function up(e){ pointers.delete(e.pointerId); if (pointers.size<2) pinch0=null; canvas.style.cursor='grab';
    if (pointers.size===0 && downAt && moved<8){ const h=hit(e); if (h){ if (h.object.userData.node){ api.onProbe && api.onProbe(h.object.userData.node); } else if (h.object.userData.slot){ api.onPick && api.onPick(h.object.userData.slot); } } }
    if (pointers.size===0) downAt=null; }
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', ()=>{ tip.style.display='none'; if (hoverSlot){ hoverSlot=null; api.select(api._sel);} });
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); cam.dist=Math.max(4,Math.min(40,cam.dist*(1+Math.sign(e.deltaY)*0.08))); }, {passive:false});

  // ---------- mount & loop ----------
  let host=null, running=false, last=performance.now(), smokeT=0;
  api.mount = function(el){ host=el; el.style.position='relative'; el.appendChild(canvas); el.appendChild(tip); resize(); if(!running){ running=true; requestAnimationFrame(loop); } };
  function resize(){ if(!host) return; const w=host.clientWidth||600, h=host.clientHeight||380; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body); window.addEventListener('resize', resize);
  applyCam();
  function loop(now){
    const dt=Math.min(0.1,(now-last)/1000); last=now;
    if (host && host.isConnected){
      if (canvas.width!==Math.round(host.clientWidth*renderer.getPixelRatio())) resize();
      for (let i=tweens.length-1;i>=0;i--){ const tw=tweens[i]; tw.t+=dt/tw.dur; const k=Math.min(1,tw.t); tw.fn(k); if(k>=1){ tweens.splice(i,1); tw.done&&tw.done(); } }
      // tube glow
      for (const id of ['V1','V2','V3','V4','V5']){ const o=slotObj[id]; if(!o) continue; const ud=o.g.userData, gl=liveState.glow[id]||0, flick=1+(Math.random()-0.5)*0.04;
        ud.heatM.opacity=gl*0.95; ud.halo.material.opacity=gl*0.35*flick; ud.light.intensity=gl*1.6*flick;
        const red=liveState.red[id]?1:0; ud.plateM._live=true; ud.plateM.emissive.setRGB(0.9*red,0.12*red,0.02*red); ud.plateM.emissiveIntensity=red?1.2+Math.sin(now/180)*0.2:0; }
      if (cabG.userData.dial) cabG.userData.dial.material.emissive.setRGB(0.5*(liveState.dialLit||0),0.3*(liveState.dialLit||0),0.05*(liveState.dialLit||0));
      // speaker cone excursion
      const sp=slotObj.SP1; if (sp && sp.g.userData.cone){ sp.g.userData.cone.position.z=-0.25+Math.sin(now/22)*0.03*Math.min(1,liveState.loud||0)+Math.sin(now/2.65)*0.012*Math.min(1,liveState.hum||0)*3; }
      // smoke
      smokeT+=dt; if (smokeT>0.18){ smokeT=0; for (const id of liveState.smoke||[]){ const o=slotObj[id]; if(!o) continue; const p=new THREE.Vector3(); o.g.getWorldPosition(p); p.y+= api.flipped? 0.5 : -0.2; if(!api.flipped && PLACE[id][0]==='under'){ p.y=chassis.position.y+0.2; p.x+=(Math.random()-0.5)*0.4; } puff(p); } }
      for (let i=smokes.length-1;i>=0;i--){ const s=smokes[i]; s.userData.life+=dt; s.position.addScaledVector(s.userData.v,dt); const k=s.userData.life/2.4; s.scale.setScalar(0.5+k*2); s.material.opacity=0.6*(1-k); if(k>=1){ scene.remove(s); s.material.dispose(); smokes.splice(i,1);} }
      applyCam(); renderer.render(scene,camera);
    }
    requestAnimationFrame(loop);
  }
  return api;
})();

  capchk: {name:'Capacitor checker', price:34.50, blurb:'Bridge for capacitance and a leakage test at the rated working voltage.'},

};

const R = {        // runtime (not saved)
  power:false, warm:0, rect:0, dc:null, sig:null, offV:null, offT:0, sel:null, view:'bench3d', cam:'overview', showTestPosts:false,
  tool:'meter', side:'insp', inst:'vom', mode:'V', range:{vom:250,vtvm:150,ohvom:100,ohvtvm:100}, pol:1,
  probe:null, ohmTarget:null, tubeTarget:null, capTarget:null, tracePt:null, audio:null, mute:false,

};

// ---------- persistence ----------
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const t=localStorage.getItem(SAVE_KEY); if(t){ const o=JSON.parse(t); if(o&&o.ver===1) return o; } }catch(e){} return null; }
function newGame(){
  S = {ver:1, cash:40, rep:15, day:1, tools:{vom:1,tube:1,vtvm:0,capchk:0,tracer:0}, inv:{}, salvage:[], orders:[], jobs:[], bench:null, nextJob:101, log:[]};
  const start = {'R130-0.5':2,'R470000-0.5':2,'R470000-0.5':2,'R22000-0.5':2,'R68-0.5':1,'R500-2':1,'R4700000-0.5':1,'R1000-1':1,
                 'C.01-400':2,'C.047-400':0,'E20-150':2,'T35Z3':1,'T50L6GT':1,'T7C6':1,'T7B7':1,'T7A8':1};
  for (const [k,v] of Object.entries(start)) if (v && CATALOG[k]) S.inv[k]=v;

function shopLog(t, cls=''){ S.log.unshift({d:S.day,t,cls}); S.log.length=Math.min(S.log.length,60); }
function dateStr(d){ const base = new Date(1955,2,7); let n=d-1, dt=new Date(base); while(n>0){ dt.setDate(dt.getDate()+1); if(dt.getDay()!==0) n--; } return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' 1955'; }
function stage(){ let s=STAGES[0][1]; for(const [r,n] of STAGES) if(S.rep>=r) s=n; return s; }

// ---------- customers & faults ----------
function addJob(forceTier){
  const tier = forceTier || (1 + (S.rep>32?1:0) + (S.rep>58?1:0));
  let r, ob, faults, tries=0;
  do {
    r = newRadio(); faults=[];
    const n = tier===1 ? 1 : (Math.random()<0.45 ? 2 : 1);
    for (let i=0;i<n;i++){ const f=pickFault(tier); if(!faults.includes(f.id)){ f.apply(r); faults.push(f.id);} }
    customerUse(r, 20 + Math.random()*40);
    ob = observe(r); tries++;
  } while (tries<12 && healthyEnough(ob.g));
  for (const p of Object.values(r.slots)){ p.used=true; p.heat=0; }
  const [brand,model,cab] = BRANDS[Math.floor(Math.random()*BRANDS.length)];
  const job = {id:S.nextJob++, cust:FIRST[Math.floor(Math.random()*FIRST.length)], brand, model, cab,
    complaint: complaintFrom(ob.g), budget: +(2.5 + tier*1.5 + Math.random()*3).toFixed(2), labor: +(3.5 + tier*1.75 + Math.random()*1.5).toFixed(2),
    due: S.day + 2 + Math.floor(Math.random()*3) + (tier>1?1:0), status:'waiting', radio:r, tray:[], used:[], tier, faults};
  r.vol = 0.35; r.dial = 560 + Math.floor(Math.random()*20)*50;
  S.jobs.push(job);
  return job;
}
function healthyEnough(g){ return g.lit && g.loud>0.42 && g.hum<0.06 && g.dist<0.12 && g.crackle<0.2 && g.station; }
function complaintFrom(g){
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const lines=[];
  if (!g.lit) lines.push(pick(['Plugged it in and nothing. No light, no hum, nothing at all.','It went dead in the middle of the evening news. Not even the dial light.','Completely dead. My son-in-law says it\'s the plug, but I tried the lamp outlet.']));
  else if (g.loud<0.05 && !g.station && g.hum>0.03) lines.push(pick(['The tubes light up and it hums, but it won\'t pull in a single station.','Warms up and hums. Turn the dial all you like, no stations.']));
  else if (g.loud<0.05 && !g.station) lines.push(pick(['Lights up, but there\'s no stations anywhere on the dial.','You can hear a little hiss and that\'s all. No programs.']));
  else if (g.loud<0.05) lines.push(pick(['The tubes glow but it doesn\'t make a sound.','Lights up fine, stays quiet. Not a peep.','Dial lights, nothing comes out of the speaker.']));
  if (g.lit && g.hum>0.06) lines.push(pick(['There\'s a terrible hum over everything.','It hums like a refrigerator.','Loud buzzing hum, even with the volume down.']));
  if (g.lit && g.dist>0.15 && g.loud>0.05) lines.push(pick(['The voices sound fuzzy and garbled, worse after it warms up.','Music comes out scratchy and distorted.','It sounds like the announcer has a mouthful of gravel.']));
  if (g.lit && g.loud>=0.05 && g.loud<0.38) lines.push(pick(['It\'s weak. I have to turn it all the way up.','Plays, but so quiet you can barely hear it across the kitchen.']));
  if (g.crackle>0.3) lines.push(pick(['It crackles and cuts out when you turn the volume knob.','Scratchy noise whenever I touch the volume.']));
  if (!lines.length) lines.push('It just doesn\'t sound right anymore.');
  const extra = pick(['','',' Smelled something hot last week.',' My husband thinks it\'s the tubes.',' It was fine until we moved it to the den.',' I need it back for the ball game.']);
  return lines.slice(0,2).join(' ') + extra;
}
function benchJob(){ return S.jobs.find(j=>j.id===S.bench) || null; }

// ---------- simulation tick ----------
function meterLoad(){
  if (R.tool!=='meter' || R.mode!=='V' || !R.probe) return null;
  if (R.inst==='vtvm') return {node:R.probe, R:11e6};
  return {node:R.probe, R:1000*R.range.vom};
}
function tick(){
  const job = benchJob(); if (!job){ R.dc=null; R.sig=null; audioUpdate(); return; }
  const r = job.radio; const dt=0.2;
  const lit = heaterString(r);
  if (R.power && lit){ R.warm = Math.min(1, R.warm + dt/9); }
  else R.warm = Math.max(0, R.warm - dt/6);
  if (R.power || R.warm>0){
    R.dc = settle(r, {warm: easeWarm(R.warm), meter: meterLoad(), guess: R.dc && R.dc.V});
    R.sig = sigPath(r, R.dc);
    if (R.power){
      const ev = applyStress(r, R.dc, dt*0.3);
      ev.forEach(e => benchLog('⚠ '+e, 'bad'));
      for (const [id,st] of Object.entries(R.dc.stress)){
        const p=r.slots[id]; if (p && p.heat>0.6 && st.ratio>1.4 && !R.smelled[id+p.pid]){ R.smelled[id+p.pid]=1; benchLog(`You smell something hot near ${id}.`, 'hot'); }
      }
      if (ev.length) { renderViews(); renderSide(); }
      R.offV = Float64Array.from(R.dc.V); R.offT = 0;
    }
  } else { R.dc=null; R.sig=null; }
  if (!R.power && R.offV){ R.offT += dt; }
  updateLive();
  audioUpdate();
}
const easeWarm = w => w<=0?0: Math.min(1, w*w*(3-2*w)*1.0);
function chargeV(node){ // stored charge after switch-off (no bleeder resistor in these sets)
  if (R.power || !R.offV) return 0;
  const r = benchJob().radio; const c1ok = r.slots.C1 && r.slots.C1.leak0>0.5;
  const tau = c1ok ? 40 : 2;
  return R.offV[NI[node]]*Math.exp(-R.offT/tau);
}
function charged(){ return !R.power && R.offV && Math.max(chargeV('B1'),chargeV('B2'))>30; }

function benchLog(t,cls=''){ R.benchLog.unshift({t,cls}); R.benchLog.length=Math.min(R.benchLog.length,40); const el=$('#benchLog'); if(el) el.innerHTML = logHTML(R.benchLog); }
function logHTML(a){ return a.map(x=>`<div class="${x.cls}">${esc(x.t)}</div>`).join('') || '<div>Bench is quiet.</div>'; }

// ---------- actions ----------
function setPower(on){
  const job=benchJob(); if(!job) return;
  if (on && hasEmpty(job.radio)) { benchLog('Some sockets or terminals are empty. The set will run, but the circuit is incomplete.', 'hot'); }
  R.power = on;
  if (on){ audioInit(); R.offV=null; benchLog('Plugged in through the isolation transformer and switched on.'); }
  else benchLog('Switched off and unplugged. The filter capacitors hold their charge for a while.');
  renderBenchHead(); renderFront(); renderTools();
}
function hasEmpty(r){ return Object.keys(SLOTS).some(k=>!r.slots[k]); }
function canWork(){
  if (R.power){ toast('Switch the set off before you unsolder anything.'); return false; }
  if (charged()){ toast(`You catch a jolt from the filter capacitor (${Math.round(Math.max(chargeV('B1'),chargeV('B2')))} V). Discharge the B+ first.`); return false; }
  return true;
}
function removePart(slot){
  const job=benchJob(); if(!job || !canWork()) return;
  const p = job.radio.slots[slot]; if(!p) return;
  p.from = slot; job.tray.push(p); job.radio.slots[slot]=null;
  benchLog(`Removed ${slot} (${skuName(p.sku)}) and set it on the bench tray.`);
  R.sel = {tray:p.pid}; save(); renderAll();
}
function installSku(slot, sku){
  const job=benchJob(); if(!job || !canWork()) return;
  if (job.radio.slots[slot]) { toast('Remove the old part first.'); return; }
  if (!(S.inv[sku]>0)) return;
  S.inv[sku]--; if(!S.inv[sku]) delete S.inv[sku];
  const p = newPart(sku); job.radio.slots[slot]=p; job.used.push({sku, price:CATALOG[sku].price});
  benchLog(`Installed a new ${skuName(sku)} at ${slot}.`, 'good');
  R.sel = {slot}; save(); renderAll();
}
function installLoose(slot, pid, from){
  const job=benchJob(); if(!job || !canWork()) return;
  if (job.radio.slots[slot]) { toast('Remove the old part first.'); return; }
  const arr = from==='tray' ? job.tray : S.salvage; const i = arr.findIndex(p=>p.pid===pid); if(i<0) return;
  const p = arr.splice(i,1)[0]; job.radio.slots[slot]=p; delete p.from;
  benchLog(`Installed ${from==='tray'?'the part from the tray':'a salvaged '+skuName(p.sku)} at ${slot}.`);
  R.sel={slot}; save(); renderAll();
}
function discharge(){ if (R.power) return; R.offV=null; benchLog('Shorted B+ to chassis through a 1 kΩ resistor. Filter caps discharged.'); renderBenchHead(); updateLive(); }
function compatible(slot, p){
  const d=SLOTS[slot]; const kind = p.kind || CATALOG[p.sku||p].kind; if (kind!==SLOT_ACCEPTS[d.type]) return false;
  if (d.type==='TUBE'){ const t = p.tube || CATALOG[p.sku||p].tube; return t===d.tube; }
  return true;
}

// ---------- checkout ----------
function runCheckout(){
  const job=benchJob(); if(!job) return;
  if (hasEmpty(job.radio)) { toast('Every socket and terminal needs a part before the checkout.'); return; }
  R.power=false; R.warm=0; R.dc=null;
  const r = job.radio; const before = JSON.stringify(r.slots);
  let d=null; const events=[];
  r.vol = 0.6; r.dial = 880;
  for (let t=0;t<600;t++){ d = settle(r,{guess:d&&d.V}); events.push(...applyStress(r,d,1)); }
  const results=[]; let pass=true;
  const stations=[];
  for (const kc of [610,880,1150]){ r.dial=kc; const dd=settle(r,{guess:d.V}); const g=sigPath(r,dd); stations.push({kc,g,d:dd}); }
  const main = stations[1];
  const g = main.g, dd = main.d;
  const add=(label,val,ok)=>{ results.push({label,val,ok}); if(!ok) pass=false; };
  add('Tube heaters (series string)', g.lit?'All lit':'Open string', g.lit);
  add('Stations received (610 / 880 / 1150 kc)', stations.map(s=>s.g.station?'✓':'—').join(' '), stations.every(s=>s.g.station));
  add('Audio output, volume at 6', (g.loud*1.6).toFixed(2)+' W', g.loud>=0.42);
  const humExcess=Math.max(0,g.hum-(REF.goodHum||0)), distortionExcess=Math.max(0,g.dist-(REF.goodDist||0));
  add('Excess hum vs model reference', humExcess.toFixed(3)+' relative units', humExcess<=0.06);
  add('Excess distortion vs model reference', distortionExcess.toFixed(3)+' relative units', distortionExcess<=0.12);
  add('Volume control', g.crackle>0.2?'Scratchy':'Smooth', g.crackle<=0.2);
  let worst=null; for (const [id,st] of Object.entries(dd.stress)){ if(st.ratio>1.02 && (!worst||st.ratio>worst.r)) worst={id,r:st.ratio}; }
  add('All parts within ratings', worst?`${worst.id} at ${Math.round(worst.r*100)}%`:'Yes', !worst);
  add('No failures during 10-minute run', events.length?events.join('; '):'None', !events.length);
  const v4p = dd.V[NI.P5], b2 = dd.V[NI.B2];
  job.lastCheck = {pass, results, at:S.day};
  if (events.length) benchLog('Checkout: '+events.join('; '), 'bad');
  save(); renderAll();
  showCheckout(job, pass, results, {B1:dd.V[NI.B1], B2:b2, P5:v4p});
}
function bill(job){
  const parts = job.used.reduce((a,u)=>a+u.price,0);
  let partsPaid = parts, note='';
  if (parts > job.budget){ partsPaid = job.budget; S.rep = Math.max(0,S.rep-2); note=` ${job.cust} only authorized ${money(job.budget)} in parts and paid that.`; }
  const total = job.labor + partsPaid;
  S.cash += total; const fast = S.day <= job.due-1;
  S.rep = Math.min(100, S.rep + 3 + (fast?1:0) + (job.tier>1?1:0));
  job.status='closed'; S.bench=null; R.power=false; R.warm=0; R.dc=null; R.sel=null; R.probe=null; R.offV=null; R.benchLog=[];
  // leftover tray parts become salvage, faulty or not; you decide what to keep
  S.salvage.push(...job.tray.map(p=>{delete p.from; p.used=true; return p;}));
  S.jobs = S.jobs.filter(j=>j.id!==job.id);
  shopLog(`${job.cust} picked up the ${job.brand}. Paid ${money(total)} (labor ${money(job.labor)}, parts ${money(partsPaid)}).${note}`,'good');
  save(); closeModal(); renderAll();
}
function returnUnrepaired(){
  const job=benchJob(); if(!job) return;
  // put removed parts back where they came from so the customer gets their set back intact
  for (const p of [...job.tray]) if (p.from && !job.radio.slots[p.from]) { job.radio.slots[p.from]=p; job.tray.splice(job.tray.indexOf(p),1); }
  S.salvage.push(...job.tray); job.tray=[];
  S.cash += 1.5; S.rep = Math.max(0,S.rep-1);
  S.jobs = S.jobs.filter(j=>j.id!==job.id); S.bench=null; R.power=false; R.warm=0; R.dc=null; R.sel=null; R.offV=null;
  shopLog(`Returned ${job.cust}'s ${job.brand} unrepaired. Charged the $1.50 bench fee.`,'bad');
  save(); renderAll();
}
function closeDay(){
  R.power=false; R.warm=0;
  S.day++;
  S.cash -= 1.75; shopLog(`Rent, light and heat: −$1.75.`);
  const arrived = S.orders.filter(o=>o.arrive<=S.day);
  for (const o of arrived){ S.inv[o.sku]=(S.inv[o.sku]||0)+o.qty; }
  if (arrived.length) shopLog(`Parts delivery: ${arrived.map(o=>o.qty+'× '+skuName(o.sku)).join(', ')}.`);
  S.orders = S.orders.filter(o=>o.arrive>S.day);
  for (const j of [...S.jobs]){ if (j.due < S.day){ S.rep=Math.max(0,S.rep-4); shopLog(`${j.cust} came for the ${j.brand} and left angry. It wasn't ready.`,'bad');
      if (S.bench===j.id){ S.bench=null; } S.salvage.push(...j.tray); S.jobs=S.jobs.filter(x=>x.id!==j.id);} }
  const waiting = S.jobs.length;
  let n = 1 + (Math.random() < S.rep/90 ? 1 : 0);
  for (let i=0;i<n && waiting+i<5;i++){ const j=addJob(); shopLog(`${j.cust} dropped off a ${j.brand} ${j.model}.`); }
  if (S.cash<0) shopLog('The shop is in the red. Collect on some repairs before buying more stock.','bad');
  R.offV=null; save(); renderAll();
}
function buy(sku, qty, rush){
  const price = CATALOG[sku].price*qty*(rush?1.25:1);
  if (S.cash < price){ toast('Not enough cash on hand.'); return; }
  S.cash -= price;
  if (rush){ S.inv[sku]=(S.inv[sku]||0)+qty; shopLog(`Picked up ${qty}× ${skuName(sku)} at the jobber: ${money(price)}.`); }
  else { S.orders.push({sku,qty,arrive:S.day+1}); shopLog(`Ordered ${qty}× ${skuName(sku)}: ${money(price)}. Arrives tomorrow.`); }
  save(); renderHeader(); renderSide(); renderShopLog();
}
function buyTool(k){ const e=EQUIPMENT[k]; if (S.cash<e.price){ toast('Not enough cash on hand.'); return; } S.cash-=e.price; S.tools[k]=1; shopLog(`Bought a ${e.name}: ${money(e.price)}.`,'good'); save(); renderAll(); }

// ---------- toast ----------
let toastT=0;

// Circuit-stage map: each line and terminal group is derived from PT44_FACTORY_SUBGRAPH.
// It deliberately does not connect devices absent from the verified source graph.
function pt44FactoryStageSVG(selected){
  const G=PT44_FACTORY_SUBGRAPH;
  const ids=['F_BPLUS_RECT','F_BPLUS_FILT','F_7C6_PLATE','F_50L6_GRID','F_50L6_CATH','F_OUTPUT_PLATE','F_BMINUS','F_VOICE_SEC_A','F_VOICE_SEC_B'];
  const byId=Object.fromEntries(G.nets.map(n=>[n.id,n]));
  const pos={F_BPLUS_RECT:[105,88],F_BPLUS_FILT:[300,88],F_7C6_PLATE:[485,88],F_50L6_GRID:[690,88],F_50L6_CATH:[690,245],F_OUTPUT_PLATE:[900,88],F_BMINUS:[325,245],F_VOICE_SEC_A:[900,245],F_VOICE_SEC_B:[1100,245]};
  const lines=[['F_BPLUS_RECT','F_BPLUS_FILT','#28 field winding'],['F_BPLUS_FILT','F_7C6_PLATE','#21 plate load'],['F_7C6_PLATE','F_50L6_GRID','#20 coupling capacitor'],['F_50L6_GRID','F_50L6_CATH','50L6 tube · not a direct wire'],['F_OUTPUT_PLATE','F_VOICE_SEC_A','#26 primary/secondary magnetic coupling']];
  let z=`<svg viewBox="0 0 1235 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Source-constrained Philco PT-44 audio and power circuit network map. Nodes are clickable."><rect width="1235" height="360" fill="#fcf8ee"/>`;
  for(const [a,b,label] of lines){
    const [x1,y1]=pos[a],[x2,y2]=pos[b];
    z+=`<path d="M${x1+53},${y1+30} L${x2-53},${y2+30}" class="segment" stroke-dasharray="${label.includes('not a direct')||label.includes('magnetic')?'7 6':'none'}"/><text x="${(x1+x2)/2}" y="${Math.min(y1,y2)+12}" text-anchor="middle">${label}</text>`;

// Schematic-like topological view generated from precisely the same PT44_MODEL graph that
// builds the 3D conductor routes. This map is a developer/technician diagnostic view, NOT
// a replacement for the genuine manufacturer schematic.
function modelConnectivitySVG(){
  const names=Object.keys(PT44_MODEL.nodes);
  const cols=3, cw=355,ch=202,rows=Math.ceil(names.length/cols),width=1080,height=68+rows*ch+14;
  const escText=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let s=`<svg class="net-map" viewBox="0 0 ${width} ${height}" role="img" aria-label="Partial modeled circuit connectivity graph">`;
  s+=`<rect width="${width}" height="${height}" fill="#efe6d1"/><text x="20" y="27" font-size="19" font-weight="700" fill="#443421">PT-44 · MODEL CONNECTIVITY</text><text x="20" y="46" font-size="12" fill="#746c5a">Generated from the same modeled electrical nodes used by 3D wires. NOT a complete factory schematic. Click a node to trace.</text>`;
  const colors={B1:'#a33e2b',B2:'#b15c2a',GND:'#56685b',G5:'#54785a',G6:'#54785a',OSC:'#54785a'};
  names.forEach((name,i)=>{
    const col=i%cols,row=Math.floor(i/cols),x=14+col*cw,y=64+row*ch;
    const endpoints=PT44_MODEL.nodes[name], color=colors[name]||'#546672',active=R.traceNet===name;
    s+=`<g data-trace-net="${name}" tabindex="0" role="button"><rect x="${x}" y="${y}" width="338" height="187" rx="6" fill="${active?'#fff5d3':'#faf5e8'}" stroke="${active?'#b67c30':'#b6ae95'}" stroke-width="${active?3:1.1}"/><rect x="${x}" y="${y}" width="338" height="32" rx="5" fill="${color}"/><text x="${x+11}" y="${y+22}" font-size="17" font-weight="700" fill="#fff">${name}</text><text x="${x+323}" y="${y+21}" text-anchor="end" font-size="11" fill="#fff">${endpoints.length} TERMINALS</text>`;
    const step=17, shown=endpoints.slice(0,8);const bx=x+23,by=y+49;
    s+=`<path d="M${bx} ${by} V${by+(shown.length-1)*step}" stroke="${color}" stroke-width="3"/>`;
    shown.forEach((ref,j)=>{const yy=by+j*step;s+=`<circle cx="${bx}" cy="${yy}" r="3.5" fill="${color}"/><path d="M${bx+4} ${yy} h16" stroke="${color}" stroke-width="1.3"/><text x="${bx+27}" y="${yy+4}" font-family="monospace" font-size="11" fill="#3e382c">${escText(ref)}</text>`;});
    if(endpoints.length>8)s+=`<text x="${x+30}" y="${y+175}" font-size="11" fill="#746c5a">… plus ${endpoints.length-8} more</text>`;
    s+='</g>';
  });
  s+='</svg>';return s;
}

// v0.15 · Tube-datasheet crosscheck; NEVER upgrades a receiver-specific net to factory-verified.
function pt44TubePinAudit(){
  const r=PT44_TUBE_REVIEW, g=PT44_FACTORY_V3, errors=[], knownPins=[];
  for(const [tube, d] of Object.entries(r.tube_pinouts)){
    if(g.tube_pin_reference[tube]?.type!==d.type)errors.push(tube+': mismatch in factory tube type');
    if(Object.keys(d.pin_roles).length!==8)errors.push(tube+': pinout must cover all eight socket positions');
    for(const h of g.tube_pin_reference[tube]?.heater||[]){
      if(d.pin_roles[h]!=='heater')errors.push(tube+': pin '+h+' is not a heater');
    }
  }
  for(const net of g.factory_nets){
    for(const ref of net.factory_members){
      const [device,pin]=ref.split(':');
      if(!device.startsWith('V'))continue;
      const role=r.tube_pinouts[device]?.pin_roles?.[pin];
      if(!role || role==='no connection' || role.startsWith('shell /'))errors.push(net.id+': invalid active tube pin '+ref);
      else knownPins.push({net:net.id,terminal:ref,electrode:role});
    }
  }
  for(const task of r.review_tasks){
    const [device,term]=task.terminal.split(':');
    if(device.startsWith('V')){
      if(!r.tube_pinouts[device]?.pin_roles?.[term] || r.tube_pinouts[device].pin_roles[term]==='no connection')errors.push(task.id+': undefined tube pin');
    }else if(!g.factory_components[device]?.terminals.includes(term))errors.push(task.id+': undefined part terminal');
    if(task.status==='source_trace_required'){
      if(task.factory_net_claim!==false)errors.push(task.id+': open review task is wrongly marked as certified');
    }else if(task.status==='source_traced_net_member'){
      const net=g.factory_nets.find(n=>n.factory_members.includes(task.terminal));
      const expected=task.id==='RF-02'?'engineering/PT44_Rider_12_45_Crosscheck_V1.json':task.id==='POWER-01'?'engineering/PT44_Power_Pin_Crosswalk_V1.json':['RF-03','IF-04'].includes(task.id)?'engineering/PT44_Supply_AVC_Reconciliation_V1.json':null;
      if(task.factory_net_claim!==true||!expected||task.source_artifact!==expected||!net)errors.push(task.id+': claimed traced pin lacks its evidence');
    }else if(task.status==='source_traced_internal_equivalence'){
      if(task.terminal!=='V3:4'||task.internal_peer!=='V3:7'||task.external_wire_claim!==false||task.factory_net_claim!==true||task.source_artifact!=='engineering/PT44_Supply_AVC_Reconciliation_V1.json'||!g.factory_nets.find(n=>n.id==='F_BMINUS')?.factory_members.includes('V3:7')||g.factory_nets.some(n=>n.factory_members.includes('V3:4')))errors.push(task.id+': internal equivalence confused with an external socket wire');
    }else if(task.status==='source_traced_shared_45v_screen_conductor'){
      const net=g.factory_nets.find(n=>n.id==='F_SCREEN_45V');
      if(task.factory_net_claim!==true||task.source_artifact!=='engineering/PT44_7A8_Screen_Trace_V1.json'||!net?.factory_members.includes(task.terminal))errors.push(task.id+': source-traced pin claim lacks matching evidence');
    }else if(task.status==='source_traced_pin_crosswalk_complete'){
      const net=g.factory_nets.find(n=>n.id==='F_BPLUS_FILT');
      if(task.factory_net_claim!==true||task.terminal!=='V4:4'||task.source_artifact!=='engineering/PT44_Output_IF_Supply_Trace_V1.json'||!net?.factory_members.includes(task.terminal))errors.push(task.id+': source-traced pin claim lacks matching output-stage evidence');
    }else errors.push(task.id+': review task has an unrecognized closure status');
  }
  const h=r.heater_check;
  const sum=h.tubes.reduce((n,v)=>n+v.operating_volts,0);
  if(Math.abs(sum-h.total_operating_reference_volts)>1e-6 || h.tubes.some(v=>v.operating_current_amps!==0.15))errors.push('heater string 6.3 V operating reference mismatch');
  if(Math.abs((h.illustrative_line_volts-sum)/0.15-h.idealized_series_resistance_for_nominal_current_ohms)>1e-6)errors.push('heater idealized resistor math mismatch');
  return {ok:errors.length===0,errors,tubes:Object.keys(r.tube_pinouts).length,checkedPinMemberships:knownPins,reviewTasks:r.review_tasks.length,heaterOperatingVolts:sum};
}

  <p class="sl-footnote">Source separation: tube electrode maps are derived from tube data sheets; actual PT-44 node memberships come only from the Philco drawing and must pass independent review.</p>`;

function pt44PassiveAudit(){
  const p=PT44_PASSIVE_V1,g=PT44_FACTORY_V3,issues=[];

    if(!g.factory_components[id])issues.push('Unnumbered passive device '+id);

    if(d.windings){
      if(d.windings.length!==2)issues.push(id+': expected separate primary and secondary');
      let used=new Set();
      for(const w of d.windings){
        if(w.endpoints.length!==2||w.endpoints[0]===w.endpoints[1])issues.push(id+': bad winding endpoint pair');
        for(const ref of w.endpoints){
          if(!validRef(ref))issues.push(id+': undeclared '+ref);
          if(used.has(ref))issues.push(id+': primary/secondary shorted at '+ref);
          used.add(ref);
        }
        if(w.inductance_henries!==null||w.dc_resistance_ohms!==null)issues.push(id+': unmeasured winding value incorrectly certified');
      }
      if(d.mutual_coupling_k!==null)issues.push(id+': guessed magnetic coupling');
    }
    if(d.sections){

      if(d.sections[0].endpoints[0]===d.sections[1].endpoints[1])issues.push('#30: resistor ends shorted');
      for(const s of d.sections)for(const ref of s.endpoints)if(!validRef(ref))issues.push(id+': undeclared '+ref);
      if(d.sections.reduce((s,x)=>s+x.ohms,0)!==d.end_to_end_nominal_ohms)issues.push('#30: end-to-end resistance mismatch');

  if(bypass?.connection_nets?.slice().sort().join('|')!=='F_50L6_CATH|F_BMINUS')issues.push('#22: endpoint nets differ from factory trace');
  if(p.acceptance?.output_cathode_bypass_traced!==true)issues.push('#22: source trace not recorded in acceptance ledger');

  else {
    if(A.factory_members.length!==3||!A.factory_members.includes('30:endA')||!A.factory_members.includes('32:a')||!A.factory_members.includes('31:b'))issues.push('Pilot lamp line endpoint mismatch');
    if(B.factory_members.length!==3||!B.factory_members.includes('30:tap')||!B.factory_members.includes('32:b')||!B.factory_members.includes('V5:2'))issues.push('Pilot lamp resistor tap endpoint mismatch');

  }
  if(!p.acceptance||p.acceptance.spice_ready!==false||p.acceptance.benchmark_ready!==false||g.checks.benchmark_ready!==false)issues.push('Premature engineering readiness certification');

// ===== v0.13 · Philco factory transcription / provenance gate =====
function factoryV3Audit(){
  const r=PT44_FACTORY_V3, issues=[], assigned=new Map(), stage={}, unmapped=[];
  for(const [id,c] of Object.entries(r.factory_components)){
    if(!Array.isArray(c.terminals)||new Set(c.terminals).size!==c.terminals.length)issues.push('#'+id+': invalid terminal declarations');
  }
  for(const n of r.factory_nets){
    stage[n.stage]=(stage[n.stage]||0)+1;
    for(const ref of n.factory_members){
      const [id,pin]=ref.split(':');
      const exists=id.startsWith('V')?r.tube_pin_reference[id] : r.factory_components[id];
      if(!exists)issues.push(ref+': factory part/tube not declared');
      else if(id.startsWith('V') ? !/^\d$/.test(pin)||Number(pin)<1||Number(pin)>8 : !exists.terminals.includes(pin)) issues.push(ref+': terminal not declared');
      if(assigned.has(ref)&&assigned.get(ref)!==n.id)issues.push(ref+': multiple electrical nets');
      assigned.set(ref,n.id);
    }
    if(!n.evidence||n.evidence.printed_page!==38)issues.push(n.id+': source provenance missing');
  }
  for(const [id,c] of Object.entries(r.factory_components))if(!c.model_slots.length)unmapped.push(id);
  const unknownConnections = r.open_issues.filter(x=>x.severity==='blocker');
  return {issues,sourceNets:r.factory_nets.length,parts:Object.keys(r.factory_components).length,
    tracedTerminals:assigned.size,stages:stage,unmapped,unknownConnections,
    benchmarkReady:issues.length===0&&r.checks.factory_wiring_fully_transcribed&&r.checks.simulator_matches_factory&&r.checks.chassis_lead_dress_factory_verified&&unknownConnections.length===0};
}

  const track=p.resistive_track, sw=p.separate_switch;

  for(const t of [track.end_A,track.end_B,track.wiper,sw.contact_A,sw.contact_B])if(!known(t))errors.push('#16 undefined terminal '+t);
  if(track.full_resistance_ohms!==null||track.taper!==null||sw.load_routing!==null)errors.push('Unverified #16 potentiometer or switch parameters certified');
  if(i.winding_secondary.join(',')!=='14:sDetector,14:sReturn'||i.detector_diode_terminal!==null||i.avc_routing_verified!==false)errors.push('Untraced second IF / detector connection certified');

  if(compare.use_for_pass_fail||compare.solver_node_equivalence_verified||compare.pass_tolerance_pct!==null||compare.voltage_reference_return!==null)errors.push('Historical voltage labels used as calibrated simulator acceptance criteria');

function pt44ContinuityBuild(g=PT44_FACTORY_V3, passive=PT44_PASSIVE_V1, spec=PT44_CONTINUITY_V1){
  const terminalToWire = new Map(), groups=new Map(), warnings=[];
  const declared=new Set(['__CHASSIS__']);
  for(const [id,p] of Object.entries(g.factory_components))for(const t of p.terminals)declared.add(id+':'+t);
  for(const [id,p] of Object.entries(PT44_TUBE_REVIEW.tube_pinouts))for(const t of Object.keys(p.pin_roles))declared.add(id+':'+t);
  for(const net of g.factory_nets){
    groups.set(net.id,net.factory_members.slice());
    for(const terminal of net.factory_members){
      if(!declared.has(terminal))warnings.push(net.id+': undeclared terminal '+terminal);
      if(terminalToWire.has(terminal)&&terminalToWire.get(terminal)!==net.id)warnings.push(terminal+': bridged two source wire-nets');
      terminalToWire.set(terminal,net.id);
    }
  }
  const nodeFor=t=>terminalToWire.get(t)||('UNTRACED:'+t);
  const edges=[];
  const add=(id,a,b,kind,ohms,evidence)=>{
    if(!declared.has(a)||!declared.has(b))warnings.push(id+': unknown component terminal');
    if(a===b||(nodeFor(a)===nodeFor(b)&&kind!=='tube_internal_link'))warnings.push(id+': component electrically bypassed in sourced wire ledger');
    edges.push({id,a,b,na:nodeFor(a),nb:nodeFor(b),kind,ohms,evidence});
  };
  for(const e of spec.known_passive_edges)add(e.id,e.from,e.to,e.kind,e.ohms,e.evidence);
  for(const e of PT44_TUBE_INTERNAL_V1.certified_metallic_links)add(e.id,e.from,e.to,'tube_internal_link',0,e.evidence);
  for(const [part,ohms] of spec.component_resistances)add('R'+part,part+':a',part+':b','fixed_resistor',ohms,'Philco RMS p.38 factory value #'+part);
  for(const [part,dev] of Object.entries(passive.devices))if(dev.windings){
    for(const w of dev.windings)add(part+':'+w.id,w.endpoints[0],w.endpoints[1],'transformer_winding',w.dc_resistance_ohms,'Windings distinct; measured DC resistance unknown');
  }
  return {terminalToWire,groups,edges,warnings,declared,nodeFor};
}
function pt44ContinuityQuery(a,b,g=pt44ContinuityBuild()){
  if(!g.declared.has(a)||!g.declared.has(b))return {kind:'invalid',path:[],reason:'Unknown factory terminal'};
  const start=g.nodeFor(a),target=g.nodeFor(b);
  if(start===target)return {kind:'same_wire_net',path:[],nodes:[start],net:start,ohms:0};
  // First a conductor net, then components that connect their ends. No capacitors or magnetic coupling as DC wire edges.
  const todo=[{node:start,path:[],nodes:[start],knownSum:0}];const seen=new Set([start]);
  while(todo.length){
    const s=todo.shift();
    for(const e of g.edges){
      const next=e.na===s.node?e.nb:e.nb===s.node?e.na:null;
      if(next===null||seen.has(next))continue;
      const q={node:next,path:[...s.path,e],nodes:[...s.nodes,next],knownSum:s.knownSum+(typeof e.ohms==='number'?e.ohms:0)};
      if(next===target)return {kind:q.path.every(e=>e.kind==='tube_internal_link')?'tube_internal_connection':'component_path',path:q.path,nodes:q.nodes,net:null,ohms:q.path.some(e=>e.ohms===null)?null:q.knownSum};
      seen.add(next);todo.push(q);
    }
  }
  return {kind:'untraced',path:[],nodes:[start],net:null,ohms:null};
}
function pt44ContinuityAudit(spec=PT44_CONTINUITY_V1){
  const g=pt44ContinuityBuild(),issues=g.warnings.slice();let passed=0;
  const internal=pt44InternalAudit(); if(!internal.ok)issues.push(...internal.issues);
  if(PT44_FACTORY_V3.factory_nets.length<18)issues.push('Fewer than 18 baseline source nets');
  if(g.groups.get('F_BMINUS')?.includes('__CHASSIS__'))issues.push('Metal chassis fused with B−');
  for(const c of spec.analysis_cases){
    const result=pt44ContinuityQuery(c.a,c.b,g);
    if(result.kind!==c.expect)issues.push(c.id+': expected '+c.expect+' but got '+result.kind);
    else if(c.expected_component&&!result.path.some(p=>p.id===c.expected_component))issues.push(c.id+': missing required '+c.expected_component);
    else if(c.nominal_path_ohms!==undefined&&c.nominal_path_ohms!==null&&result.ohms!==c.nominal_path_ohms)issues.push(c.id+': wrong selected branch value');
    else passed++;
  }
  if(spec.analysis_cases.some(c=>c.expect==='isolated'||c.expect==='open'||c.expect==='factory_verified_open'))issues.push('Do not claim an ohmmeter open from a partial graph');
  if(spec.acceptance.benchmark_ready||spec.acceptance.actual_chassis_bond_transcribed||spec.acceptance.detector_external_wiring_transcribed)issues.push('Unfinished factory circuit cannot be certified');
  return {ok:issues.length===0,issues,passed,total:spec.analysis_cases.length,wireGroups:g.groups.size,sourceTerminals:g.terminalToWire.size,deviceEdges:g.edges.length,untraced:spec.analysis_cases.filter(c=>c.expect==='untraced').length};
}
function pt44ContinuityHTML(stage,esc){

    <p>This view tests the <b>factory-traced conductor groups</b> separately from <b>electrical components</b>. A connection marked <b>NOT YET TRACED</b> is not a confirmed open circuit or measured fault. The game's simplified ground is <b>not</b> a certified chassis connection.</p>

    <table class="sl-table sl-continuity"><thead><tr><th>Case / stage</th><th>Terminals</th><th>Source-limited result</th></tr></thead><tbody>${tests.map(c=>{
      const q=pt44ContinuityQuery(c.a,c.b,g),through=q.path.map(p=>p.id).join(' → ');
      return `<tr><td><b>${esc(c.id)}</b><small style="display:block">${esc(c.stage)}</small></td><td>${esc(c.a)} ↔ ${esc(c.b)}</td><td><b>${name[q.kind]||esc(q.kind)}</b>${through?`<small style="display:block">${esc(through)}${q.ohms!==null?' · selected series path '+q.ohms+' Ω':''}</small>`:''}<small style="display:block">${esc(c.reason)}</small></td></tr>`;
    }).join('')}</tbody></table>
    <p class="sl-footnote">Published Philco 1941 RMS, p.38; cross-refer against Rider/PT-44. A winding's unknown DC resistance is not zero; transformer windings have <b>magnetic coupling, not a copper junction</b>. The resistor branch values are <b>not equivalent measured resistance</b> if parallel paths exist. No speculative edges enter SPICE or 3D routing.</p>`;
}

function pt44PowerFilterAudit(){
 const a=PT44_POWER_FILTER_AUDIT_V1,g=PT44_FACTORY_V3,errors=[];
 for(const f of a.findings){
  const n=g.factory_nets.find(x=>x.id===f.net_id),review=n&&n.v0_29_power_filter_audit;
  if(!n||!review){errors.push('Missing source graph net or review record: '+f.net_id);continue;}
  if([...f.verified_members,...f.unreviewed_members].some(m=>!n.factory_members.includes(m)))errors.push('Historically audited member is missing from graph net '+f.net_id);
  if(review.status!==f.status||review.source_scan_sha256!==a.source.native_scan.sha256)errors.push('Graph review metadata differs for '+f.net_id);
  if(review.verified_members.join('|')!==f.verified_members.join('|')||review.unreviewed_members.join('|')!==f.unreviewed_members.join('|'))errors.push('Verified/unreviewed subset differs for '+f.net_id);
 }
 if(a.benchmark_ready!==false||g.checks.benchmark_ready!==false)errors.push('Power-filter audit cannot certify the complete PT-44 benchmark');
 if(!a.findings.some(x=>x.net_id==='F_BPLUS_RECT'&&x.verified_members.includes('26:a')))errors.push('The first B+ membership must include #26:a after the v0.29 review');
 if(!a.scope_exclusions.includes('any bond between B− and metal chassis'))errors.push('Chassis bond must remain out of scope');
 return {ok:!errors.length,errors,findings:a.findings.length,verifiedMemberships:a.findings.reduce((n,x)=>n+x.verified_members.length,0),unreviewedMemberships:a.findings.reduce((n,x)=>n+x.unreviewed_members.length,0),benchmarkReady:false};
}
function pt44PowerFilterAuditHTML(esc){
 const a=PT44_POWER_FILTER_AUDIT_V1,q=pt44PowerFilterAudit();
 return `<h3>Power and filter source audit · ${esc(a.version)}</h3>
 <div class="sl-alert" style="background:${q.ok?'#e7d5a9':'#f1cdc7'}"><b>POWER-FILTER AUDIT: ${q.ok?'PASS':'FAIL'}</b> · ${q.findings} source findings · ${q.verifiedMemberships} verified terminal memberships · ${q.unreviewedMemberships} still unreviewed${q.errors.length?' · '+q.errors.map(esc).join('; '):''}</div>
 <ul>${a.findings.map(f=>`<li><b>${esc(f.label)}</b> — ${esc(f.verified_members.join(', '))}${f.unreviewed_members.length?'; still unreviewed: '+esc(f.unreviewed_members.join(', ')):''}. ${esc(f.source_note)}</li>`).join('')}</ul>
 <p>Scope remains limited to this filter slice. AC input, 35Z3 anode, heater wiring, #31 line capacitor and any B− to chassis bond remain unresolved.</p>`;
}

function pt44FaultNetwork(scenario){
 const known=PT44_PASSIVE_FAULTS_V1.scenarios.find(x=>x.id===scenario);
 if(!known)throw Error('Unknown isolated RC failure scenario');
 const e=pt44PassiveComponents(),base=[e.find(x=>x.name==='Philco #18'),e.find(x=>x.name==='Philco #19')].map(x=>({...x}));
 if(base.some(x=>!x))throw Error('Required factory passive model absent');
 const cap=base[0],res=base[1];
 switch(known.action){
  case 'healthy':break;
  case 'open_capacitor':return [res]; // capacitor becomes nonconducting, source remains unconnected
  case 'short_capacitor':cap.type='R';cap.value=known.example_ohms;break;
  case 'leaky_capacitor':return [cap,res,{name:'Illustrative insulation leakage across Philco #18',type:'R',value:known.example_ohms,a:cap.a,b:cap.b}];
  case 'drift_resistor':res.value=known.example_ohms;break;

function pt44FaultStudyAudit(){

 try{

  const expected=[['healthy','healthy',null],['open18','open_capacitor',null],['short18','short_capacitor',0.01],['leak18','leaky_capacitor',100000],['drift19','drift_resistor',470000]];
  if(f.scenarios.length!==expected.length)issues.push('Unexpected fault scenario list');
  for(const [id,action,ohms] of expected){const s=f.scenarios.find(x=>x.id===id);
   if(!s||s.action!==action||s.example_ohms!==ohms)issues.push('Unsupported/mutated fault fixture: '+id);

  if(f.is_factory_failure_measurement||f.full_receiver_fault_validated||f.complete_spice_model)issues.push('Hypothetical faults must not be treated as historical evidence or completed SPICE');

  if(at('drift19',10)>=at('healthy',10))issues.push('Grid resistance drift should increase highpass cutoff');

  for(const s of f.scenarios)for(const hz of [0,1,10,1000])if(results[s.id][hz].kclResidualAmps>1e-10)issues.push('KCL mismatch '+s.id+' @ '+hz+' Hz');

function hearText(){
  const job=benchJob(); if(!job) return '';
  if (!R.power && R.warm<=0) return 'The set is off.';
  const g=R.sig; if(!g || !g.lit) return R.power ? 'Nothing. No dial light, no tube glow, no sound.' : 'Silent.';
  if (R.warm<0.5 && R.power) return 'Heaters glowing, warming up…';
  const bits=[];
  const r=job.radio;
  if (g.loud>0.04 && g.station) bits.push(`${g.station.call} ${({band:'brass band concert',talk:'morning talk program',waltz:'waltz orchestra',news:'news bulletins'})[g.station.prog]}${g.loud<0.25?', faint':g.loud>0.9?', loud':''}`);
  else if (g.loud>0.04) bits.push('hiss between stations');
  else if (r.vol<0.05) bits.push('volume turned down');
  else bits.push('no program');
  if (g.dist>0.4) bits.push('badly distorted'); else if (g.dist>0.12) bits.push('fuzzy, distorted');
  if (g.hum>0.15) bits.push('loud hum'); else if (g.hum>0.06) bits.push('noticeable hum'); else if (g.hum>0.03) bits.push('faint hum');
  if (g.stat>0.15) bits.push('static');
  if (g.crackle>0.3) bits.push('crackles when the volume moves');
  return bits.join(' · ');
}

  const glow=$('#dialGlow'); if(glow) glow.style.opacity = lit*0.95;
  const h=$('#hear'); if(h) h.innerHTML = `<b>Speaker</b><span>${esc(hearText())}</span>`;
  for (const id of ['V1','V2','V3','V4','V5']){ const g=document.getElementById('glow-'+id); const t=r.slots[id];
    if (g) g.setAttribute('opacity', (t && t.heaterOk && R.dc && R.dc.lit) ? (0.25+0.75*lit).toFixed(2) : 0);
    const rp=document.getElementById('red-'+id); if(rp) rp.setAttribute('opacity', (t && t.redplate && R.power)?0.85:0); }
  if (B3.ok && R.view==='bench3d'){

    if (R.power && R.dc) for (const [id,st] of Object.entries(R.dc.stress)){ const p=r.slots[id]; if (p && st.ratio>1.3 && (p.heat>0.6 || id==='V4')) smoke.push(id); }
    B3.live({glow, red, smoke, loud: R.sig&&!R.mute?R.sig.loud:0, hum: R.sig?R.sig.hum:0, dialLit: lit});

}

// ---------- SVG helpers ----------
const P = (x,y)=>`${x.toFixed(1)},${y.toFixed(1)}`;
function seg(x1,y1,x2,y2){ const L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L; return {L,ux,uy,nx:-uy,ny:ux}; }
function zig(x1,y1,x2,y2){ const s=seg(x1,y1,x2,y2), a=0.28, b=0.72; let d=`M${P(x1,y1)} L${P(x1+s.ux*s.L*a,y1+s.uy*s.L*a)}`;
  const n=6; for(let i=1;i<=n;i++){ const t=a+(b-a)*(i-0.5)/n, sgn=i%2?1:-1; d+=` L${P(x1+s.ux*s.L*t+s.nx*7*sgn, y1+s.uy*s.L*t+s.ny*7*sgn)}`; }
  d+=` L${P(x1+s.ux*s.L*b,y1+s.uy*s.L*b)} L${P(x2,y2)}`; return d; }
function capPath(x1,y1,x2,y2,elec){ const s=seg(x1,y1,x2,y2), m=s.L/2, g=4, w=13;
  const ax=x1+s.ux*(m-g), ay=y1+s.uy*(m-g), bx=x1+s.ux*(m+g), by=y1+s.uy*(m+g);
  let d=`M${P(x1,y1)} L${P(ax,ay)} M${P(ax-s.nx*w,ay-s.ny*w)} L${P(ax+s.nx*w,ay+s.ny*w)}`;
  if (elec) d+=` M${P(bx-s.nx*w+s.ux*4,by-s.ny*w+s.uy*4)} Q${P(bx-s.ux*2,by-s.uy*2)} ${P(bx+s.nx*w+s.ux*4,by+s.ny*w+s.uy*4)}`;
  else d+=` M${P(bx-s.nx*w,by-s.ny*w)} L${P(bx+s.nx*w,by+s.ny*w)}`;
  d+=` M${P(bx,by)} L${P(x2,y2)}`; return d; }
function coilPath(x1,y1,x2,y2,n=4){ const s=seg(x1,y1,x2,y2), a=0.15, len=s.L*(1-2*a), r=len/n/2; let d=`M${P(x1,y1)} L${P(x1+s.ux*s.L*a,y1+s.uy*s.L*a)}`;
  for(let i=0;i<n;i++){ const ex=x1+s.ux*(s.L*a+(i+1)*2*r), ey=y1+s.uy*(s.L*a+(i+1)*2*r); d+=` A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${P(ex,ey)}`; }
  d+=` L${P(x2,y2)}`; return d; }
const gnd=(x,y)=>`<path class="w" d="M${x},${y} v8 M${x-10},${y+8} h20 M${x-6},${y+12} h12 M${x-2},${y+16} h4"/>`;
const wire=pts=>`<path class="w" d="M${pts.map(p=>P(p[0],p[1])).join(' L')}"/>`;
const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3" class="jn"/>`;
function lbl(x,y,id,val,anchor='start'){ return `<text x="${x}" y="${y}" class="lb" text-anchor="${anchor}"><tspan class="lid">${id}</tspan><tspan x="${x}" dy="13">${val}</tspan></text>`; }
function nomLabel(id){ const c=CATALOG[SLOTS[id].nom]; if(c.kind==='R') return fmtOhms(c.ohms).replace(' ','')+' '+fmtW(c.W).replace(' ',''); if(c.kind==='C') return fmtCap(c.uF).replace(' ','')+' '+c.V+'V'; return ''; }
function part(id, inner){ const sel=R.sel&&R.sel.slot===id; const job=benchJob(); const empty=!job.radio.slots[id];
  return `<g class="part${sel?' sel':''}${empty?' empty':''}" data-slot="${id}" tabindex="0" role="button" aria-label="${id} ${esc(SLOTS[id].name)}">${inner}</g>`; }

function bands(ohms){ const e=Math.floor(Math.log10(ohms)); const d=Math.round(ohms/Math.pow(10,e-1)); const a=Math.floor(d/10)%10, b=d%10; return [BANDC[a],BANDC[b],BANDC[Math.max(0,e-1)]]; }

// ---------- side panel: inspector, drawer, catalog, data ----------
function renderSide(){
  const tabs=[['insp','Inspector'],['audit','Wiring audit'],['drawer','Parts drawer'],['cat','Catalog'],['data','Service data']];
  $('#sideTabs').innerHTML = tabs.map(([k,n])=>`<button class="tab ${R.side===k?'on':''}" data-t="${k}">${n}</button>`).join('');
  $('#sideTabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ R.side=b.dataset.t; renderSide(); });
  const el=$('#sideBody');
  if (R.side==='insp') el.innerHTML = inspectorHTML(), bindInspector();
  else if(R.side==='audit') el.innerHTML=auditHTML();
  else if (R.side==='drawer') el.innerHTML = drawerHTML(), bindDrawer();
  else if (R.side==='cat') el.innerHTML = catalogHTML(), bindCatalog();
  else el.innerHTML = dataHTML();
}
function physNotes(p, slot){
  const n=[];
  if (!p) return n;
  if (p.kind==='R'){ if (p.charred) n.push('Body is darkened and blistered from heat.'); if (p.open && !p.charred) n.push('Looks normal.'); }
  if (p.kind==='C'){ if (p.ctype==='electrolytic' && (p.heat>2||p.leak0<0.3)) n.push('Can is bulged; electrolyte has seeped from the seal.'); else if (p.ctype==='paper' && p.used) n.push('Wax casing is cracked with age.'); }
  if (p.kind==='TUBE'){ if (p.redplate && R.power) n.push('Plate is glowing cherry red!'); if (R.power && R.dc && !R.dc.lit) n.push('No heater glow (none of the tubes are lit).'); }
  if (p.kind==='OT' && p.heat>20) n.push('Smells of cooked varnish.');
  if (!n.length) n.push('Nothing obviously wrong by eye.');
  if (p.used) n.push('Original part from the set.');
  return n;
}
function inspectorHTML(){
  const job=benchJob(); if(!job) return '<div class="empty">Put a set on the bench to inspect parts.</div>';
  if (!R.sel) return `<div class="note">Click any part on the chassis or schematic. Tray parts appear below once you remove them.</div>${trayHTML(job)}`;
  if (R.sel.tray){ const p=job.tray.find(x=>x.pid===R.sel.tray); if(!p){ R.sel=null; return inspectorHTML(); }
    const slot=p.from;
    return `<div class="insp"><h3>${esc(skuName(p.sku))}</h3><div class="note">On the bench tray${slot?`, removed from ${slot}`:''}.</div>
      <ul class="note" style="padding-left:18px;margin:6px 0">${physNotes(p).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
      <div class="row">${slot&&!job.radio.slots[slot]?`<button class="btn" data-act="reinst">Reinstall at ${slot}</button>`:''}
      <button class="btn" data-act="ohm">Ohmmeter on it</button>
      ${p.kind==='C'?`<button class="btn" data-act="capchk">Capacitor checker</button>`:''}
      ${p.kind==='TUBE'?`<button class="btn" data-act="tube">Tube tester</button>`:''}
      <button class="btn" data-act="salv">Keep in salvage drawer</button><button class="btn warn" data-act="trash">Throw out</button></div></div>${trayHTML(job)}`; }
  const id=R.sel.slot, d=SLOTS[id], p=job.radio.slots[id];

  const loose = [...job.tray.map(x=>({p:x,from:'tray'})), ...S.salvage.map(x=>({p:x,from:'salv'}))].filter(o=>compatible(id,o.p));
  const st = R.dc && R.dc.stress[id];
  let live='';
  if (st && R.power){ if (st.P!=null) live=`<dt>Dissipating</dt><dd>${st.P.toFixed(2)} W (${Math.round(st.ratio*100)}% of rating)</dd>`; else if (st.Vc!=null) live=`<dt>Across it</dt><dd>${st.Vc.toFixed(0)} V (${Math.round(st.ratio*100)}% of rating)</dd>`; }
  const dcPart = d.a!==undefined && !d.dcFree;
  return `<div class="insp"><h3>${id} · ${esc(d.name)}</h3>
    <dl class="kv"><dt>Schematic value</dt><dd>${esc(skuName(d.nom))}</dd><dt>Installed</dt><dd>${p?esc(skuName(p.sku)):'<span style="color:var(--red)">empty</span>'}</dd>${live}</dl>
    ${p?`<ul class="note" style="padding-left:18px;margin:6px 0">${physNotes(p,id).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
    <div class="row">
      ${p?`<button class="btn" data-act="remove">Unsolder &amp; remove</button>`:''}
      ${p && dcPart?`<button class="btn" data-act="across">Ohms across ${id}</button>`:''}
      ${p && d.type==='TUBE'?`<button class="btn" data-act="tubeslot">Pull &amp; test tube</button>`:''}
      ${d.a?`<button class="btn" data-act="probe">Probe ${TP_NAME[d.a]?d.a:''}</button>`:''}
    </div>
    ${!p?`<div style="margin-top:10px" class="stack">
      <label class="note">Install from stock</label>
      ${stock.length?`<div class="row"><select id="instSel">${stock.map(k=>`<option value="${k}">${esc(skuName(k))} — ${S.inv[k]} on hand</option>`).join('')}</select><button class="btn pri" data-act="inst">Install</button></div>`:'<div class="note">Nothing in stock fits here. Check the catalog.</div>'}
      ${loose.length?`<label class="note">Or a loose part</label><div class="row"><select id="looseSel">${loose.map(o=>`<option value="${o.from}:${o.p.pid}">${esc(skuName(o.p.sku))} (${o.from==='tray'?'tray':'salvage'})</option>`).join('')}</select><button class="btn" data-act="instL">Install</button></div>`:''}
    </div>`:''}

}
function trayHTML(job){

function bindInspector(){

function meterReading(){
  const job=benchJob(); const vt=R.inst==='vtvm';
  if (R.mode==='V'){
    const fs = vt?R.range.vtvm:R.range.vom;
    if (!R.probe) return {frac:0, text:'Leads not connected'};
    let v=0;
    if (job && R.dc && (R.power||R.warm>0)) v = R.dc.V[NI[R.probe]];
    else if (job) v = chargeV(R.probe);
    v*=R.pol;
    const frac=v/fs;
    if (frac<-0.02) return {frac:-0.06, text:'Needle kicks backward — reverse the polarity'};
    if (frac>1.03) return {frac:1.06, text:'Pinned past full scale — switch to a higher range'};
    const res = fs/50; const shown = Math.round(v/res)*res;
    return {frac, text:`≈ ${R.pol<0&&shown?'−':''}${shown.toFixed(res<1?1:0)} V on the ${fs} V scale`};
  }
  // ohms
  const mult = vt?R.range.ohvtvm:R.range.ohvom; const Rc=(vt?10:12)*mult;
  if (!R.ohmTarget) return {frac:0, text:'Leads not connected'};
  if (R.ohmTarget.node || R.ohmTarget.slot){
    if (R.power) return {frac:0.02, text:'The set is on. Never use an ohmmeter on a live circuit.'};
    if (job && charged()) return {frac:1.08, text:'Needle slams over — the filter caps are still charged'};
  }
  let ohms;
  if (R.ohmTarget.loose) ohms = partOhms(R.ohmTarget.loose);
  else if (R.ohmTarget.node) ohms = ohmsBetween(job.radio, R.ohmTarget.node, null);
  else { const id=R.ohmTarget.slot, d=SLOTS[id], p=job.radio.slots[id]; if(!p) return {frac:0,text:'Nothing installed there'}; ohms = (d.a!==undefined && !d.dcFree) ? ohmsBetween(job.radio, d.a, d.b) : partOhms(p); }
  const frac = isFinite(ohms) ? Rc/(Rc+ohms) : 0;
  const q = Math.round(frac*200)/200;
  let text;
  if (q<=0.005) text='Needle barely moves: open, or try a higher ohms range';
  else if (q>=0.995) text='Full scale: near 0 Ω';
  else { const est = Rc*(1/q-1); text = `≈ ${fmtOhms(+est.toPrecision(2))} (R×${mult>=1e6?'1M':mult>=1000?mult/1000+'k':mult})`; }
  return {frac, text};
}

    const iu = ileak>=1e-3 ? (ileak*1000).toFixed(1)+' mA' : (ileak*1e6).toFixed(ileak<1e-5?2:0)+' µA';
