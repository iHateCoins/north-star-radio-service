      <div class="ln"><span>Capacitance (bridge)</span><span>${p.uF<0.001?Math.round(p.uF*1e6)+' pF':p.uF<1?p.uF.toFixed(3)+' µF':p.uF.toFixed(1)+' µF'} <span class="${capOk?'pass':'fail'}">${capOk?'OK':'LOW'}</span></span></div>
      <div class="ln"><span>Leakage at ${c.V} V</span><span>${iu} <span class="${leakOk?'pass':'fail'}">${leakOk?'OK':'LEAKY'}</span></span></div></div>`; }
  return `<div class="stack"><select id="capSel"><option value="">— choose a capacitor —</option>${opts.map(([v,n])=>`<option value="${v}" ${p&&p.pid===v?'selected':''}>${esc(n)}</option>`).join('')}</select>${res}</div>`;
}
const TRACE_PTS=[['conv','V1 plate · 455 kc IF'],['if','V2 plate · IF'],['det','Volume control wiper'],['a1','V3 plate · audio'],['g5','V4 grid'],['spk','Voice coil']];
function tracerHTML(){ return `<div class="stack"><div class="note">Touch the probe to a stage and listen through the tracer's own speaker. The program should get stronger at each stage.</div><div class="bars" id="trBars"></div></div>`; }
function bindTracer(){ renderTracerLive(); }
function renderTracerLive(){
  const el=$('#trBars'); if(!el) return; const g=R.sig;
  el.innerHTML = TRACE_PTS.map(([k,n])=>{ const lv = g && g.levels ? g.levels[k] : 0; const scale={conv:2,if:1.2,det:1.5,a1:1.2,g5:1.2,spk:1}[k]; const f=Math.max(0,Math.min(1,lv*scale)); const db = lv>0.001?Math.round(20*Math.log10(lv*scale)):-60;
    return `<div class="bar ${R.tracePt===k?'on':''}" data-pt="${k}" role="button" tabindex="0"><span>${n}</span><span class="tr"><span class="fl" style="display:block;width:${(f*100).toFixed(0)}%"></span></span><span class="db">${db>-60?db+' dB':'—'}</span></div>`; }).join('') + `<div class="row"><button class="btn sm" id="trOff">${R.tracePt?'Stop listening':'Not listening'}</button></div>`;
  el.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{ R.tracePt=b.dataset.pt; audioInit(); renderTracerLive(); });
  $('#trOff').onclick=()=>{ R.tracePt=null; renderTracerLive(); };
}
document.addEventListener('change', e=>{ if (e.target && e.target.id==='capSel'){ const id=+e.target.value; const job=benchJob(); R.capTarget = (job&&job.tray.find(x=>x.pid===id)) || S.salvage.find(x=>x.pid===id) || null; renderTools(); } });

// ---------- audio ----------
function genProgram(ctx, kind){
  const sr=ctx.sampleRate, len=sr*8, buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  const note=(f,t0,dur,amp,harm=[1,.5,.3])=>{ const a=Math.floor(t0*sr), b=Math.min(len,Math.floor((t0+dur)*sr)); for(let i=a;i<b;i++){ const t=(i-a)/sr, env=Math.min(1,t*40)*Math.exp(-t*2.2/dur); let v=0; harm.forEach((h,k)=>v+=h*Math.sin(2*Math.PI*f*(k+1)*t)); d[i]+=v*amp*env; } };
  const midi=m=>440*Math.pow(2,(m-69)/12);
  if (kind==='band'){ const mel=[67,72,76,79,77,76,74,72,71,72,74,76,72,67,69,71]; mel.forEach((m,i)=>note(midi(m),i*0.5,0.45,0.22,[1,.7,.5,.3,.2]));
    for(let i=0;i<16;i++){ note(midi(i%2?43:36),i*0.5,0.3,0.25,[1,.4,.2]); note(midi(i%2?60:64),i*0.5+0.25,0.2,0.08,[1,.5]); } }
  else if (kind==='waltz'){ const ch=[[62,66,69],[67,71,74],[64,67,71],[62,66,69]]; for(let bar=0;bar<8;bar++){ const c=ch[bar%4]; note(midi(c[0]-12),bar*1,0.3,0.25,[1,.4]); note(midi(c[1]),bar+1/3,0.25,0.09); note(midi(c[2]),bar+1/3,0.25,0.09); note(midi(c[1]),bar+2/3,0.25,0.09); note(midi(c[2]),bar+2/3,0.25,0.09);
      const ml=[74,76,78,79,81,79,78,76][bar]; note(midi(ml),bar,0.95,0.18,[1,.3,.1]); } }
  else { // speech-like: glottal pulse train through moving formants, syllable envelope
    const forms=[[730,1090],[270,2290],[530,1840],[570,840],[300,870],[660,1720]];
    let ph=0, y1=[0,0], y2=[0,0]; let syl=0, F=forms[0], nextSyl=0, f0=118;
    for(let i=0;i<len;i++){ const t=i/sr;
      if (t>=nextSyl){ syl++; F=forms[Math.floor(Math.random()*forms.length)]; nextSyl=t+0.14+Math.random()*0.16; if (Math.random()<0.12) nextSyl+=0.35; f0=kind==='news'?135:110+Math.random()*25; }
      const sylT=(t-(nextSyl-0.2)); const env = Math.max(0,Math.sin(Math.PI*Math.min(1,Math.max(0,(nextSyl-t)/0.2))));
      ph+=f0/sr; let src=0; if(ph>=1){ph-=1; src=1;} src += (Math.random()-0.5)*0.05;
      let out=0; for(let k=0;k<2;k++){ const f=F[k], r=0.985, w=2*Math.PI*f/sr; const y=src + 2*r*Math.cos(w)*y1[k] - r*r*y2[k]; y2[k]=y1[k]; y1[k]=y; out+=y*(k?0.5:1); }
      d[i]=out*env*0.06; }
    if (kind==='news'){ for(let k=0;k<6;k++){ const t0=k*1.3+0.1; for(let j=0;j<4;j++) note(1000,t0+j*0.12,0.06,0.15,[1]); } } }
  let mx=0; for(let i=0;i<len;i++) mx=Math.max(mx,Math.abs(d[i])); for(let i=0;i<len;i++) d[i]/=mx||1;
  return buf;
}
function curve(k, asym){ const n=1024, c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; let y=Math.tanh(k*x)/Math.tanh(k); if(asym&&y<0) y*=1-asym*0.6; c[i]=y; } return c; }
function audioInit(){
  if (R.audio) { if (R.audio.ctx.state==='suspended') R.audio.ctx.resume(); return; }
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
  let ctx; try { ctx=new AC(); } catch(e){ return; }
  const A={ctx, st:{}, distK:-1};
  A.master=ctx.createGain(); A.master.gain.value=0.8;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=160;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3800;
  const pk=ctx.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=1200; pk.gain.value=4;
  A.shaper=ctx.createWaveShaper(); A.shaper.curve=curve(1,0); A.shaper.oversample='2x';
  A.pre=ctx.createGain(); A.pre.connect(A.shaper); A.shaper.connect(hp); hp.connect(pk); pk.connect(lp); lp.connect(A.master); A.master.connect(ctx.destination);
  for (const st of STATIONS){ const src=ctx.createBufferSource(); src.buffer=genProgram(ctx, st.prog); src.loop=true; const g=ctx.createGain(); g.gain.value=0; src.connect(g); g.connect(A.pre); src.start(ctx.currentTime+Math.random()); A.st[st.call]=g; }
  const hum=ctx.createOscillator(); hum.type='sawtooth'; hum.frequency.value=60; const hlp=ctx.createBiquadFilter(); hlp.type='lowpass'; hlp.frequency.value=420; A.hum=ctx.createGain(); A.hum.gain.value=0; hum.connect(hlp); hlp.connect(A.hum); A.hum.connect(A.pre); hum.start();
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const ns=ctx.createBufferSource(); ns.buffer=nb; ns.loop=true; const nbp=ctx.createBiquadFilter(); nbp.type='bandpass'; nbp.frequency.value=2200; nbp.Q.value=0.6; A.stat=ctx.createGain(); A.stat.gain.value=0; ns.connect(nbp); nbp.connect(A.stat); A.stat.connect(A.pre);
  A.crk=ctx.createGain(); A.crk.gain.value=0; ns.connect(A.crk); A.crk.connect(A.pre); ns.start();
  const wh=ctx.createOscillator(); wh.type='sine'; A.whf=wh.frequency; A.wh=ctx.createGain(); A.wh.gain.value=0; wh.connect(A.wh); A.wh.connect(A.pre); wh.start();
  R.audio=A;
}
function audioUpdate(){
  const A=R.audio; if(!A) return; const t=A.ctx.currentTime, set=(p,v)=>p.setTargetAtTime(v,t,0.08);
  const job=benchJob(); const g=R.sig;
  const off = !job || !g || !g.lit || R.mute;
  A.master.gain.setTargetAtTime(off?0:0.8, t, 0.1);
  if (off){ return; }
  const r=job.radio;
  let loud=g.loud, hum=g.hum, stat=g.stat, dist=g.dist;
  if (R.tracePt && S.tools.tracer){ const lv=g.levels[R.tracePt]||0; loud=lv*1.1; hum = ['a1','g5','spk'].includes(R.tracePt)?g.hum:g.hum*0.1; stat = g.stat*(R.tracePt==='conv'||R.tracePt==='if'?2:1); dist = R.tracePt==='spk'||R.tracePt==='g5'?g.dist:g.dist*0.3; }
  const xs = STATIONS.map(st=>st.pwr*Math.exp(-Math.pow((r.dial-st.kc)/9,2))); const mx=Math.max(...xs,1e-4);
  STATIONS.forEach((st,i)=>set(A.st[st.call].gain, g.station||R.tracePt ? 0.55*loud*(xs[i]/mx)*Math.min(1,mx*3) : 0));
  set(A.hum.gain, Math.min(0.7,hum*1.6));
  set(A.stat.gain, Math.min(0.5,stat*0.9));
  // heterodyne squeal just off a station's carrier
  const near = STATIONS.map((st,i)=>({d:r.dial-st.kc,x:xs[i]})).sort((a,b)=>b.x-a.x)[0];
  set(A.wh.gain, g.osc>0 ? Math.min(0.05, 0.06*near.x*Math.max(0,Math.abs(near.d)-2)/6)*(r.vol) : 0); A.whf.setTargetAtTime(400+Math.abs(near.d)*180, t, 0.05);
  if (R.crackleKick || (g.crackle>0.2 && Math.random()<0.15*g.crackle)){ A.crk.gain.cancelScheduledValues(t); A.crk.gain.setValueAtTime(0.25+0.4*g.crackle,t); A.crk.gain.setTargetAtTime(0,t+0.02,0.02); R.crackleKick=0; }
  const k = Math.round((1+dist*28)*2)/2; if (k!==A.distK){ A.distK=k; A.shaper.curve=curve(k, dist>0.3?dist:0); }
}

// ---------- modals ----------
function closeModal(){ $('#modal').innerHTML=''; }
function modal(html){ $('#modal').innerHTML=`<div class="modal" id="mbg"><div class="card" role="dialog" aria-modal="true">${html}</div></div>`; $('#mbg').onclick=e=>{ if(e.target.id==='mbg') closeModal(); }; }
function confirmModal(title, body, ok, fn){ modal(`<div class="ph">${esc(title)}</div><div class="pb stack"><div>${esc(body)}</div><div class="row"><button class="btn pri" id="mOk">${esc(ok)}</button><button class="btn" id="mNo">Cancel</button></div></div>`); $('#mOk').onclick=()=>{ closeModal(); fn(); }; $('#mNo').onclick=closeModal; }
function showCheckout(job, pass, results, v){
  const parts = job.used.reduce((a,u)=>a+u.price,0);
  modal(`<div class="ph">Checkout · RO № ${job.id}</div><div class="pb stack"><div class="sheet"><h4>${esc(job.brand)} ${esc(job.model)} — 10-minute run</h4>
    ${results.map(r=>`<div class="ln"><span>${esc(r.label)}</span><span>${esc(r.val)} <span class="${r.ok?'pass':'fail'}">${r.ok?'PASS':'FAIL'}</span></span></div>`).join('')}
    <div class="ln"><span>B+1 / B+2 / V4 plate</span><span>${v.B1.toFixed(0)} / ${v.B2.toFixed(0)} / ${v.P5.toFixed(0)} V</span></div></div>
    ${pass?`<div class="ok">The set plays properly. Bill: labor ${money(job.labor)} + parts ${money(parts)}${parts>job.budget?` (customer authorized only ${money(job.budget)})`:''}.</div>
      <div class="row"><button class="btn pri" id="mBill">Return set &amp; collect</button><button class="btn" id="mBack">Keep working</button></div>`
     :`<div class="alert">Not ready to go home. Find what failed and keep troubleshooting.</div><div class="row"><button class="btn pri" id="mBack">Back to the bench</button></div>`}
  </div>`);
  $('#mBack').onclick=closeModal; if (pass) $('#mBill').onclick=()=>bill(job);
}
function showManual(){
  modal(`<div class="ph">Service manual<span class="sp"></span><button class="btn sm" id="mX">Close</button></div><div class="pb manual">
  <p>You run a one-bench radio shop in 1955. Every set on the counter is the same five-tube AC-DC superhet circuit with its own failed parts. The current solver is a simplified five-stage training model; factory pinouts and the accurate Philco circuitry are being integrated. The 1941 factory-data tab contains verified historic references.</p>
  <h3>The job</h3><p>Put a repair order on the bench. Switch it on and listen. Diagnose with the meter and tube tester, unsolder bad parts, install replacements, then run the 10-minute checkout. A passing set goes home with the customer and you collect labor plus parts.</p>
  <h3>Measuring</h3><p>In DC volts, click a ● test point on the schematic to put the red lead there. Compare against the Service data tab. Your starting VOM draws 1,000 Ω per volt of range, so it pulls high-resistance points down: the 7C6 plate may read low in this provisional model. A VTVM reads them correctly.</p>
  <p>Ohms only works with the set off and the filter caps discharged. In-circuit readings include every parallel path. Pull a part to measure it alone.</p>
  <h3>Safety and damage</h3><p>The set has no bleeder resistor, so B+ stays charged after switch-off. Discharge it before you unsolder. Parts that run past their ratings get hot and fail, during your testing or during checkout. A leaky coupling capacitor will cook the output tube and its cathode resistor again if you only replace the burned resistor. A quarter-watt resistor where a 2-watt one belongs will not last.</p>
  <h3>Substitutions</h3><p>Any resistor fits any resistor position, and any capacitor fits any capacitor position. The circuit decides whether your choice works. Watch voltage ratings on capacitors and wattage on resistors.</p>
  <h3>Business</h3><p>Rent is $1.75 a day. Mail-order parts arrive the next morning; the jobber sells today at 25% over list. If your parts bill runs over what the customer authorized, they pay only the authorized amount and grumble. Miss a due date and they take the set back, angry. Reputation brings harder jobs and more customers.</p>
  <div class="row" style="margin-top:12px"><button class="btn warn sm" id="mReset">Start a new shop (erases this save)</button></div>
  </div>`);
  $('#mX').onclick=closeModal;
  $('#mReset').onclick=()=>confirmModal('Start over?','This erases your cash, tools, parts and customers.','Erase and restart',()=>{ R.power=false; R.warm=0; R.dc=null; R.sel=null; R.benchLog=[]; newGame(); save(); renderAll(); });
}

// ---------- boot ----------
function renderAll(){ renderHeader(); renderTickets(); renderShopLog(); renderBench(); renderSide(); renderTools(); }
function boot(){
  calibrate();
  if (B3.ok){
    B3.tpName = n=>TP_NAME[n];
    B3.onPick = slot=>{ R.sel={slot}; R.side='insp'; B3.select(slot); renderSide(); if (R.tool==='tube' && SLOTS[slot].type==='TUBE'){ R.tubeTarget={slot}; renderTools(); }
      if (window.matchMedia('(max-width:800px)').matches) toast(`${slot} · ${SLOTS[slot].name} — details in the Inspector below`); };
    B3.onProbe = node=>{ R.tool='meter'; if (R.mode==='V') R.probe=node; else R.ohmTarget={node}; renderTools(); B3.probe(R.mode==='V'?node:null); };
  }
  S = load(); if (!S){ newGame(); save(); setTimeout(showManual, 300); }
  $('#bManual').onclick=showManual;
  $('#bDay').onclick=()=>confirmModal(`Close up for ${dateStr(S.day)}?`, 'Rent is due, tomorrow\'s deliveries arrive in the morning, and new customers may come in. Sets past their due date go home unrepaired.', 'Close for the day', closeDay);
  renderAll();
  setInterval(tick, 200);
  setInterval(save, 10000);
  window.addEventListener('pagehide', save);
}
boot();

</script>
