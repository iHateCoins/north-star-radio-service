name: PT-44 SPICE execution

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - "engineering/**"
      - "tests/test_spice_export_v23.js"
      - "tests/test_heater_model_v35.js"
      - "tests/test_output_bypass_v36.js"
      - ".github/workflows/pt44-spice-execution.yml"
  pull_request:
    paths:
      - "index.html"
      - "README.md"
      - "engineering/**"
      - "tests/test_spice_export_v23.js"
      - "tests/test_heater_model_v35.js"
      - "tests/test_output_bypass_v36.js"
      - ".github/workflows/pt44-spice-execution.yml"
  workflow_dispatch:

concurrency:
  group: pt44-spice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ngspice:
    name: Execute source-generated passive deck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated-deck parity
        run: node tests/test_spice_export_v23.js
      - name: Check heater fixture arithmetic and deck structure
        run: node tests/test_heater_model_v35.js
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice
      - name: Run SPICE AC analysis and check response
        run: |
          ngspice --batch engineering/PT44_Factory_Generated_Spice_v23.cir > /tmp/pt44-spice.log
          awk '
            $1 == "0" && $2 == "1.000000e-01" { low = $3 }
            $1 == "420" && $2 == "1.000000e+06" { high = $3 }
            END {
              if (low < 0.028 || low > 0.031 || high < 0.999 || high > 1.001) {
                printf "FAIL: 0.1 Hz=%s, 1 MHz=%s\n", low, high
                exit 1
              }
              printf "PASS: 0.1 Hz=%s, 1 MHz=%s\n", low, high
            }
          ' /tmp/pt44-spice.log
      - name: Execute heater-string boundary scenarios and check parity
        run: node tests/test_heater_model_v35.js --ngspice
      - name: Execute isolated cathode-bypass AC branch study
        run: node tests/test_output_bypass_v36.js --ngspice

      - name: Cross-check 7A8 characteristic slices and separately driven conversion
        run: node tests/test_converter_spice_v62.js --ngspice

      - name: Cross-check complete idle IF/audio/supply charging and discharge
        run: node tests/test_receiver_power_spice_v61.js --ngspice

      - name: Cross-check manufacturer rectifier alternatives and loaded supplies
        run: node tests/test_rectifier_spice_v60.js --ngspice

      - name: Cross-check nonlinear supply transients and faults against ngspice
        run: node tests/test_power_dynamics_v54.js --ngspice

      - name: Cross-check coupled audio/supply faults and meter loading against ngspice
        run: node tests/test_audio_power_v55.js --ngspice

      - name: Cross-check carrier-resolved detector/AVC and loaded probes against ngspice
        run: node tests/test_detector_spice_v56.js --ngspice

      - name: Cross-check coupled tuned IF, detector, audio and DC supply against ngspice
        run: node tests/test_if_spice_v57.js --ngspice

      - name: Cross-check loaded IF AC magnitude and phase across all three controls
        run: node tests/test_if_ac_spice_v58.js --ngspice


      - name: Retain SPICE diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-spice-failure-diagnostics-${{ github.job }}
          path: |
            tmp/v59/spice/*.log
            tmp/v59/spice/*.cir
            tmp/v62/spice/*.log
          retention-days: 7

  avc-release:
    name: Verify AVC release continuation and captured solver regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice
      - name: Verify captured CI initial state with unchanged checkpoint bounds
        run: node tests/test_avc_release_solver_v62.js --ngspice
      - name: Cross-check all coupled AVC release continuation cases
        run: node tests/test_avc_release_spice_v59.js --ngspice
      - name: Retain release solver diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-spice-failure-diagnostics-${{ github.job }}
          path: |
            tmp/v59/spice/*.log
            tmp/v59/spice/*.cir
            tmp/v62/release-solver/*.log
            tmp/v62/release-solver/*.cir
          retention-days: 7
