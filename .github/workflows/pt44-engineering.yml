name: PT-44 electrical engineering checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pt44-engineering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  factory-model-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate factory measurement and 7C6 detector ledger
        run: node tests/test_bench_v17.js
      - name: Regression-test passive devices and existing factory nets
        run: node tests/test_passive_devices_v16.js
      - name: Audit source-traced wire continuity, transformer windings and chassis return
        run: node tests/test_continuity_v18.js
      - name: Validate 7C6 tube-internal cathode and reject invented detector/chassis connections
        run: node tests/test_tube_internal_v19.js
      - name: Verify 300-dpi Philco factory detector wiring and unknown diode isolation
        run: node tests/test_detector_trace_v20.js
      - name: Check isolated factory-sourced RC complex nodal model
        run: node tests/test_passive_mna_v21.js
      - name: Audit factory-traced RC component faults with independent circuit calculations
        run: node tests/test_fault_study_v22.js
      - name: Confirm SPICE export is derived only from factory-certified passive nodes
        run: node tests/test_spice_export_v23.js
      - name: Verify PT-44 chassis positions and service alignment references
        run: node tests/test_chassis_alignment_v34.js
      - name: Check nominal heater-string arithmetic and SPICE deck structure
        run: node tests/test_heater_model_v35.js
      - name: Verify v0.36 #22 cathode-bypass source trace and AC study fixture
        run: node tests/test_output_bypass_v36.js
      - name: Validate PT-44 scope denominator and trace-ledger reconciliation
        run: node tests/test_scope_audit_v1.js
      - name: Cross-check PT-44 oscillator anode against Rider XII 12-45
        run: node tests/test_rider_oscillator_crosscheck_v52.js
      - name: Verify v0.52 power pin crosswalk and open physical boundaries
        run: node tests/test_power_pin_crosswalk_v52.js
      - name: Verify v0.37 source-traced power and AC-line topology
        run: node tests/test_power_line_trace_v37.js

      - name: Verify v0.39 #17 AVC load and detector return source trace
        run: node tests/test_detector_avc_v39.js

      - name: Verify v0.40 first IF secondary return and #13 resistor trace
        run: node tests/test_if1_secondary_v40.js
      - name: Verify v0.41 RF input branch and chassis references
        run: node tests/test_rf_input_trace_v41.js
      - name: Verify v0.42 aerial transformer and loop return trace
        run: node tests/test_aerial_transformer_trace_v42.js
      - name: Verify v0.43 oscillator return endpoints and preserve open pin crosswalk
        run: node tests/test_oscillator_return_trace_v43.js
      - name: Verify v0.50 oscillator tuning plate and left winding source trace
        run: node tests/test_oscillator_tank_v50.js
      - name: Verify v0.51 oscillator grid leak and screen bypass source trace
        run: node tests/test_oscillator_grid_screen_v51.js
      - name: Verify v0.44 7A8/7B7 screen pin crosswalk and open supply path
        run: node tests/test_7a8_screen_trace_v44.js
      - name: Verify v0.45 50L6 screen pin crosswalk and corrected tube supplies
        run: node tests/test_output_if_supply_v45.js
      - name: Keep challenged IF and oscillator continuity out of the netlist gate
        run: node tests/test_if_oscillator_recheck_v52.js
      - name: Classify all PT-44 tube socket roles without inventing receiver wiring
        run: node tests/test_pin_closure_inventory_v52.js
      - name: Verify tube pin review statuses and membership boundaries
        run: node tests/tube_pin_audit_v15.test.js
      - name: Verify PT-42/PT-44 source equivalence scope
        run: node tests/test_model_equivalence_v1.js

      - name: Verify corrected supply, screen, AVC and cathode conductors
        run: node tests/test_supply_avc_reconciliation_v53.js

      - name: Verify dynamic power behavior, energy balance, faults and workbench controls
        run: node tests/test_power_dynamics_v54.js

      - name: Verify coupled idle receiver AC/DC supply, faults, discharge and numerical bounds
        run: node tests/test_receiver_power_v61.js
      - name: Verify generated receiver supply worker and lifecycle
        run: node tests/test_receiver_power_workbench_v61.js

      - name: Verify manufacturer curve and loaded rectifier sensitivity
        run: node tests/test_rectifier_v60.js

      - name: Verify jointly solved audio, supply, loaded instruments and fault restoration
        run: node tests/test_audio_power_v55.js

      - name: Verify generated audio worker and bench result/error lifecycle
        run: node tests/test_audio_workbench_v55.js

      - name: Verify carrier-resolved detector, AVC, loading, variants and restoration
        run: node tests/test_detector_dynamics_v56.js

      - name: Verify detector worker source and lifecycle
        run: node tests/test_detector_workbench_v56.js

      - name: Verify coupled tuned IF, AVC feedback, audio and supply faults
        run: node tests/test_if_receiver_v57.js
      - name: Verify coupled IF generated worker and canonical source
        run: node tests/test_if_workbench_v57.js

      - name: Verify source-backed IF controls and loaded complex response
        run: node tests/test_if_alignment_v58.js
      - name: Verify alignment recovery in the coupled transient receiver
        run: node tests/test_if_alignment_transient_v58.js
      - name: Verify generated alignment worker and settings lifecycle
        run: node tests/test_if_alignment_workbench_v58.js

      - name: Verify one-second coupled AVC release, convergence, loading and faults
        run: node tests/test_avc_release_v59.js
      - name: Verify actual generated release worker and lifecycle
        run: node tests/test_avc_release_workbench_v59.js

      - name: Keep the EC finish line fixed and version contributions explicit
        run: node tests/test_ec_reporting_v58.js

  audio-browser:
    name: Exercise coupled audio bench in Chromium
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise actual idle receiver supply, fault/restoration and export
        run: node tests/test_receiver_power_browser_v61.js --browser
      - name: Retain idle receiver supply measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-receiver-power-browser-v061
          path: tmp/pt44-receiver-power-browser/
          retention-days: 7

      - name: Exercise rectifier selection through actual shared circuits and exports
        run: node tests/test_rectifier_browser_v60.js --browser
      - name: Retain rectifier selection evidence and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-rectifier-browser-v060
          path: tmp/pt44-rectifier-browser/
          retention-days: 7

      - name: Run actual page, background worker, fault, repair and export checks
        run: node tests/test_audio_browser_v55.js --browser
      - name: Retain desktop/mobile screenshots and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-audio-browser-v055
          path: tmp/pt44-browser/
          retention-days: 7

      - name: Exercise detector/AVC worker, faults, restoration, controls and export
        run: node tests/test_detector_browser_v56.js --browser
      - name: Retain detector desktop/mobile screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-detector-browser-v056
          path: tmp/pt44-detector-browser/
          retention-days: 7

      - name: Exercise coupled IF worker, faults, repair and loaded controls in Chromium
        run: node tests/test_if_browser_v57.js --browser
      - name: Retain coupled IF screenshots and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-if-browser-v057
          path: tmp/pt44-if-browser/
          retention-days: 7

      - name: Exercise IF sweep, three-trimmer alignment and coupled settings transfer
        run: node tests/test_if_alignment_browser_v58.js --browser
      - name: Retain alignment screenshots and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-if-alignment-browser-v058
          path: tmp/pt44-if-alignment-browser/
          retention-days: 7

      - name: Exercise one-second AVC release and continuation export in Chromium
        run: node tests/test_avc_release_browser_v59.js --browser
      - name: Retain AVC release screenshots and measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt44-avc-release-browser-v059
          path: tmp/pt44-avc-release-browser/
          retention-days: 7
