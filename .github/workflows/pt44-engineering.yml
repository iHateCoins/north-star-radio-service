name: PT-44 electrical engineering checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pt44-engineering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  factory-model-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate factory measurement and 7C6 detector ledger
        run: node tests/test_bench_v17.js
      - name: Regression-test passive devices and existing factory nets
        run: node tests/test_passive_devices_v16.js
      - name: Audit source-traced wire continuity, transformer windings and chassis return
        run: node tests/test_continuity_v18.js
      - name: Validate 7C6 tube-internal cathode and reject invented detector/chassis connections
        run: node tests/test_tube_internal_v19.js
      - name: Verify 300-dpi Philco factory detector wiring and unknown diode isolation
        run: node tests/test_detector_trace_v20.js
      - name: Check isolated factory-sourced RC complex nodal model
        run: node tests/test_passive_mna_v21.js
      - name: Audit factory-traced RC component faults with independent circuit calculations
        run: node tests/test_fault_study_v22.js
      - name: Confirm SPICE export is derived only from factory-certified passive nodes
        run: node tests/test_spice_export_v23.js
      - name: Verify PT-44 chassis positions and service alignment references
        run: node tests/test_chassis_alignment_v34.js
      - name: Check nominal heater-string arithmetic and SPICE deck structure
        run: node tests/test_heater_model_v35.js
      - name: Verify v0.36 #22 cathode-bypass source trace and AC study fixture
        run: node tests/test_output_bypass_v36.js
      - name: Validate PT-44 scope denominator and trace-ledger reconciliation
        run: node tests/test_scope_audit_v1.js
      - name: Verify v0.37 source-traced power and AC-line topology
        run: node tests/test_power_line_trace_v37.js

      - name: Verify v0.39 #17 AVC load and detector return source trace
        run: node tests/test_detector_avc_v39.js

      - name: Verify v0.40 first IF secondary return and #13 resistor trace
        run: node tests/test_if1_secondary_v40.js
      - name: Verify v0.41 RF input branch and chassis references
        run: node tests/test_rf_input_trace_v41.js
      - name: Verify PT-42/PT-44 source equivalence scope
        run: node tests/test_model_equivalence_v1.js
