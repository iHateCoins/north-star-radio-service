name: PT-44 game completion
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: pt44-game-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  behavioral-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_gameplay_v63.js
      - run: node tests/test_completion_v64.js
      - run: node tests/test_tutorial_v66.js
      - run: node tests/test_title_v67.js
      - run: node tests/test_ec_reporting_v58.js
      - run: node tests/test_supply_avc_reconciliation_v53.js
      - uses: actions/upload-artifact@v4
        with:
          name: pt44-game-core-v064
          path: |
            tmp/pt44-gameplay/
            tmp/pt44-completion/
  playable-shop:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_gameplay_browser_v63.js --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pt44-game-shop-v063
          path: tmp/pt44-gameplay-browser/
          retention-days: 7

  completion-matrix:
    name: Stock repair and service acceptance (${{ matrix.shard }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_completion_browser_v64.js --browser
        env:
          PT44_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pt44-completion-shop-${{ matrix.shard }}-v064
          path: tmp/pt44-completion-browser-${{ matrix.shard }}/
          retention-days: 7

  player-ui:
    name: Player UI, tutorial and title
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_ui_browser_v65.js --browser
      - run: node tests/test_tutorial_browser_v66.js --browser
      - run: node tests/test_title_browser_v67.js --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pt44-player-ui-v065
          path: |
            tmp/pt44-ui-v065/
            tmp/pt44-tutorial-v066/
            tmp/pt44-title-v067/
          retention-days: 7

  physical-service:
    name: Physical 3D service
    timeout-minutes: 7
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_physical_browser_v68.js --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pt44-physical-v068
          path: tmp/pt44-physical-v068/
          retention-days: 7
